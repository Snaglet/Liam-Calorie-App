/* ─── Progress photos ───────────────────────────────────────────────────────*/
function ProgressScreen({onBack}) {
  const [photos,setPhotos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [aId,setAId]=useState(null);
  const [bId,setBId]=useState(null);
  const [activeSlot,setActiveSlot]=useState("b");
  const [busy,setBusy]=useState("");
  const [confirmDel,setConfirmDel]=useState(null);
  const fileRef=useRef();
  const weights=useRef(loadWeights()).current;

  const refresh = async () => {
    const all = await progressAll();
    setPhotos(all);
    setLoading(false);
    if (all.length) {
      setAId(prev => prev && all.find(p=>p.id===prev) ? prev : all[0].id);
      setBId(prev => prev && all.find(p=>p.id===prev) ? prev : all[all.length-1].id);
    } else { setAId(null); setBId(null); }
  };
  useEffect(()=>{ refresh(); },[]);

  const add = async file => {
    setBusy("Saving photo…");
    try {
      const shot = await fileToImageData(file, PROGRESS_MAX_PX);
      if (shot) {
        const thumb = await makeThumbnail(shot.imageData.base64, "image/jpeg", PROGRESS_MAX_PX, PROGRESS_QUALITY);
        const takenAt = Date.now();
        await progressPut({
          id:"p"+takenAt, takenAt,
          dateKey: fmtKey(new Date()),
          base64: thumb || shot.imageData.base64
        });
        await refresh();
        setBId("p"+takenAt);
      }
    } catch(e) { console.warn("progress save failed:",e); }
    setBusy("");
  };

  const remove = async id => {
    setBusy("Removing…");
    try { await progressDelete(id); await refresh(); } catch(e) { console.warn(e); }
    setConfirmDel(null);
    setBusy("");
  };

  const byId = id => photos.find(p=>p.id===id);
  const weightOn = dateKey => weights.find(w=>w.date===dateKey)?.value;
  const a = byId(aId), b = byId(bId);
  const dayGap = a && b ? Math.round(Math.abs(b.takenAt-a.takenAt)/86400000) : 0;
  const wA = a && weightOn(a.dateKey), wB = b && weightOn(b.dateKey);
  const wDelta = (wA!=null && wB!=null) ? Math.round((wB-wA)*10)/10 : null;

  if (busy) return <Spinner text={busy}/>;

  const Pane = ({photo,slot,label}) => {
    const active = activeSlot===slot;
    return <div style={{flex:1,minWidth:0}} onClick={()=>setActiveSlot(slot)}>
      <div style={{position:"relative",width:"100%",aspectRatio:"3 / 4",borderRadius:14,overflow:"hidden",
        background:C.surface,border:`2px solid ${active?C.accent:C.border}`,transition:"border-color 0.2s"}}>
        {photo
          ? <img src={`data:image/jpeg;base64,${photo.base64}`} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}} alt=""/>
          : <div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:28,opacity:0.3}}>👤</span></div>}
        <div style={{position:"absolute",top:8,left:8,background:"rgba(10,10,15,0.75)",borderRadius:7,padding:"3px 8px"}}>
          <span style={{fontSize:10,fontWeight:400,color:active?C.accent:C.text}}>{label}</span>
        </div>
      </div>
      <div style={{marginTop:7,textAlign:"center"}}>
        <p style={{fontSize:12,fontWeight:300,color:C.text}}>{photo?shortDate(photo.takenAt):"—"}</p>
        {photo&&weightOn(photo.dateKey)!=null&&<p style={{fontSize:10,fontWeight:300,color:C.dim,marginTop:1}}>{weightOn(photo.dateKey)} lbs</p>}
      </div>
    </div>;
  };

  return <div style={{height:"100%",background:C.bg,overflowY:"auto",paddingBottom:48}}>
    <StickyHeader
      left={<HeaderBtn onClick={onBack}><IcBack/></HeaderBtn>}
      title="Progress photos"
      right={<HeaderBtn onClick={()=>fileRef.current.click()}><IcCamera size={19}/></HeaderBtn>}
    />
    <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>{
      const f=e.target.files[0]; e.target.value=""; if(f) add(f);
    }}/>

    {loading&&<p style={{color:C.sub,fontSize:13,textAlign:"center",padding:"48px 0"}}>Loading…</p>}

    {!loading&&photos.length===0&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"64px 32px",gap:12}}>
      <span style={{fontSize:40}}>📸</span>
      <p style={{color:C.sub,fontSize:14,fontWeight:300,textAlign:"center",lineHeight:1.6}}>Take your first photo to start the timeline. Same spot, same light, same time of day works best.</p>
      <button style={{marginTop:6,display:"flex",alignItems:"center",gap:8,background:C.accent,border:"none",borderRadius:13,color:C.bg,fontSize:14,fontWeight:500,padding:"13px 22px"}} onClick={()=>fileRef.current.click()}>
        <IcCamera size={17}/> Take photo
      </button>
    </div>}

    {!loading&&photos.length>0&&<div style={{padding:"16px 16px 0"}}>
      {photos.length===1
        ? <p style={{fontSize:12,fontWeight:300,color:C.dim,textAlign:"center",marginBottom:14,lineHeight:1.6}}>One photo so far. Take another later and they'll appear side by side.</p>
        : <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:14}}>
            <span style={{fontSize:12,fontWeight:300,color:C.sub}}>{dayGap} {dayGap===1?"day":"days"} apart</span>
            {wDelta!==null&&<span style={{fontSize:12,fontWeight:300,color:wDelta<0?C.accent:C.orange}}>
              {wDelta<0?"↓":"↑"}{Math.abs(wDelta)} lbs
            </span>}
          </div>}

      <div style={{display:"flex",gap:10,marginBottom:18}}>
        <Pane photo={a} slot="a" label="Before"/>
        <Pane photo={b} slot="b" label="After"/>
      </div>

      <p style={{fontSize:11,fontWeight:300,color:C.dim,marginBottom:10}}>
        Tap a pane to select it, then pick a photo below. Long-press a photo to delete.
      </p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:8,paddingBottom:20}}>
        {[...photos].reverse().map(p=>{
          const chosen = p.id===aId || p.id===bId;
          const tag = p.id===aId ? "A" : p.id===bId ? "B" : null;
          return <div key={p.id} style={{position:"relative"}}>
            <div
              onClick={()=>{ if(activeSlot==="a") setAId(p.id); else setBId(p.id); }}
              onContextMenu={e=>{e.preventDefault();setConfirmDel(p.id);}}
              style={{position:"relative",width:"100%",aspectRatio:"3 / 4",borderRadius:10,overflow:"hidden",
                border:`2px solid ${chosen?C.accent:"transparent"}`,cursor:"pointer",background:C.surface}}>
              <img src={`data:image/jpeg;base64,${p.base64}`} style={{width:"100%",height:"100%",objectFit:"cover",display:"block",opacity:chosen?1:0.65}} alt=""/>
              {tag&&<div style={{position:"absolute",top:3,right:3,width:16,height:16,borderRadius:5,background:C.accent,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span style={{fontSize:9,fontWeight:600,color:C.bg}}>{tag}</span>
              </div>}
            </div>
            <p style={{fontSize:9,fontWeight:300,color:C.dim,textAlign:"center",marginTop:3}}>{shortDate(p.takenAt)}</p>
            {confirmDel===p.id&&<div style={{position:"absolute",inset:0,background:"rgba(10,10,15,0.92)",borderRadius:10,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:5,padding:4}}>
              <button style={{background:C.red,border:"none",borderRadius:7,color:"#fff",fontSize:10,fontWeight:500,padding:"5px 9px"}} onClick={()=>remove(p.id)}>Delete</button>
              <button style={{background:"transparent",border:"none",color:C.sub,fontSize:10,padding:2}} onClick={()=>setConfirmDel(null)}>Cancel</button>
            </div>}
          </div>;
        })}
      </div>
    </div>}
  </div>;
}

/* Per-macro history: 30-day bars against target, plus a day-by-day list. */
function NutrientHistoryScreen({metric,goal,onBack}) {
  const META = {
    protein:{label:"Protein", color:C.protein},
    carbs:  {label:"Carbs",   color:C.carbs},
    fat:    {label:"Fat",     color:C.fat}
  };
  const meta = META[metric] || META.protein;
  const target = macroTargets(goal)[metric] || 0;
  const days = useRef(collectDays(30)).current;
  const logged = days.filter(d=>d.calories>0);
  const avg = logged.length ? Math.round(logged.reduce((s,d)=>s+d[metric],0)/logged.length) : 0;
  const hits = logged.filter(d=>d[metric]>=target).length;
  const peak = Math.max(target, ...days.map(d=>d[metric]), 1);
  const targetY = (target/peak)*100;

  const fmtDay = k => new Date(k+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

  return <div style={{height:"100%",background:C.bg,overflowY:"auto",paddingBottom:48}}>
    <StickyHeader left={<HeaderBtn onClick={onBack}><IcBack/></HeaderBtn>} title={`${meta.label} history`}/>
    <div style={{padding:"16px 16px 0"}}>

      <div style={{display:"flex",gap:10,marginBottom:16}}>
        {[["Average",`${avg}g`],["Target",`${target}g`],["Days hit",`${hits}/${logged.length||0}`]].map(([l,v])=>
          <div key={l} style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,padding:"12px 10px",display:"flex",flexDirection:"column",alignItems:"center"}}>
            <span style={{fontSize:17,fontWeight:200,color:meta.color,letterSpacing:"-0.5px"}}>{v}</span>
            <span style={{fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.5px",marginTop:3}}>{l}</span>
          </div>
        )}
      </div>

      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:16,padding:"16px 16px 12px",marginBottom:16}}>
        <p style={{fontSize:10,fontWeight:400,color:C.sub,textTransform:"uppercase",letterSpacing:"1px",marginBottom:14}}>Last 30 days</p>
        <div style={{position:"relative",height:120,marginBottom:8}}>
          {target>0&&<div style={{position:"absolute",left:0,right:0,bottom:`${targetY}%`,borderTop:`1px dashed ${C.dim}`,zIndex:1}}>
            <span style={{position:"absolute",right:0,top:-13,fontSize:9,color:C.dim}}>{target}g</span>
          </div>}
          <div style={{display:"flex",alignItems:"flex-end",gap:2,height:"100%"}}>
            {days.map(d=>{
              const v=d[metric];
              const h=Math.max(v>0?3:1,(v/peak)*100);
              return <div key={d.date} style={{flex:1,minWidth:0,height:`${h}%`,
                background: v===0 ? C.track : v>=target ? meta.color : `${meta.color}66`,
                borderRadius:"2px 2px 0 0"}}/>;
            })}
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between"}}>
          <span style={{fontSize:9,fontWeight:300,color:C.dim}}>{fmtDay(days[0].date)}</span>
          <span style={{fontSize:9,fontWeight:300,color:C.dim}}>Today</span>
        </div>
      </div>

      <p style={{fontSize:11,fontWeight:300,color:C.dim,marginBottom:10}}>Days with food logged</p>
      {logged.length===0&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"40px 0",gap:10}}>
        <span style={{fontSize:34}}>📊</span>
        <p style={{color:C.sub,fontSize:14,fontWeight:300,textAlign:"center"}}>Nothing logged in the last 30 days.</p>
      </div>}
      {[...logged].reverse().map(d=>{
        const v=d[metric];
        const pct=target>0?Math.round((v/target)*100):0;
        return <div key={d.date} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:"12px 15px",marginBottom:7}}>
          <div style={{flex:1,minWidth:0}}>
            <p style={{fontSize:13,fontWeight:300,color:C.text}}>{fmtDay(d.date)}</p>
            <div style={{height:4,borderRadius:2,background:C.track,overflow:"hidden",marginTop:6,maxWidth:150}}>
              <div style={{width:`${Math.min(pct,100)}%`,height:"100%",background:meta.color,borderRadius:2}}/>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"baseline",gap:5,flexShrink:0,paddingLeft:12}}>
            <span style={{fontSize:18,fontWeight:200,color:meta.color,letterSpacing:"-0.5px"}}>{v}</span>
            <span style={{fontSize:10,fontWeight:300,color:C.dim}}>g · {pct}%</span>
          </div>
        </div>;
      })}
    </div>
  </div>;
}

function WeightHistoryScreen({onBack}) {
  const [log,setLog]=useState(()=>{
    const all=loadWeights();
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
    return all.filter(w=>w.date>=fmtKey(cutoff)).sort((a,b)=>b.date.localeCompare(a.date));
  });
  const [editDate,setEditDate]=useState(null);
  const [editVal,setEditVal]=useState("");

  const saveAll = next => { setLog(next); saveWeights([...loadWeights().filter(w=>!next.find(n=>n.date===w.date)), ...next].sort((a,b)=>a.date.localeCompare(b.date))); };
  const commitEdit = date => {
    const n=parseFloat(editVal);
    if(!isNaN(n)&&n>0) saveAll(log.map(w=>w.date===date?{...w,value:n}:w));
    setEditDate(null);
  };
  const deleteEntry = date => {
    setLog(log.filter(w=>w.date!==date));
    saveWeights(loadWeights().filter(w=>w.date!==date));
  };
  const fmt = dateStr => new Date(dateStr+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

  return <div style={{height:"100%",background:C.bg,overflowY:"auto",paddingBottom:48}}>
    <StickyHeader left={<HeaderBtn onClick={onBack}><IcBack/></HeaderBtn>} title="Weight history"/>
    <div style={{padding:"16px 16px 0"}}>
      <p style={{fontSize:12,fontWeight:300,color:C.dim,marginBottom:16}}>Last 30 days — swipe left to delete</p>
      {log.length===0&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"48px 0",gap:10}}>
        <span style={{fontSize:36}}>⚖️</span>
        <p style={{color:C.sub,fontSize:14,fontWeight:300,textAlign:"center"}}>No weight entries yet.</p>
      </div>}
      {log.map(w=><WeightRow key={w.date} entry={w} isEditing={editDate===w.date} editVal={editVal} setEditVal={setEditVal} onTapEdit={()=>{setEditDate(w.date);setEditVal(String(w.value));}} onCommit={()=>commitEdit(w.date)} onDelete={()=>deleteEntry(w.date)} fmt={fmt}/>)}
    </div>
  </div>;
}

function WeightRow({entry,isEditing,editVal,setEditVal,onTapEdit,onCommit,onDelete,fmt}) {
  const {swipeX,swiping,handlers}=useSwipeDelete(onDelete,70);
  return <div style={{position:"relative",marginBottom:8,borderRadius:14,overflow:"hidden"}}>
    <div style={{position:"absolute",inset:0,background:C.red,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:18}}>
      <span style={{color:"#fff",fontSize:12,fontWeight:400,marginRight:4}}>Delete</span><IcTrash/>
    </div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,transform:`translateX(${swipeX}px)`,transition:swiping?"none":"transform 0.3s ease"}}
      {...handlers}>
      <span style={{fontSize:13,fontWeight:300,color:C.sub}}>{fmt(entry.date)}</span>
      <div style={{display:"flex",alignItems:"baseline",gap:6}}>
        {isEditing
          ?<input autoFocus type="number" inputMode="decimal" style={{width:70,background:"transparent",border:"none",borderBottom:`2px solid ${C.accent}`,color:C.accent,fontSize:18,fontWeight:200,fontFamily:"'Inter',sans-serif",textAlign:"right",outline:"none",letterSpacing:"-0.5px"}} value={editVal} onChange={e=>setEditVal(e.target.value)} onBlur={onCommit} onKeyDown={e=>e.key==="Enter"&&onCommit()}/>
          :<span style={{fontSize:18,fontWeight:200,color:C.text,letterSpacing:"-0.5px",cursor:"pointer"}} onClick={onTapEdit}>{entry.value}</span>
        }
        <span style={{fontSize:11,fontWeight:300,color:C.dim}}>lbs</span>
        {!isEditing&&<span style={{color:C.dim,cursor:"pointer",display:"inline-flex",alignItems:"center"}} onClick={onTapEdit}><IcEdit/></span>}
      </div>
    </div>
  </div>;
}

function App() {
  const [apiKey,setApiKey]=useState(()=>loadKey());
  const [screen,setScreen]=useState("home");
  const [baseGoal,setBaseGoal]=useState(()=>loadBaseGoal());
  const [selected,setSelected]=useState(null);
  const [camImg,setCamImg]=useState({imageData:null,preview:null});
  const [macroMetric,setMacroMetric]=useState("protein");
  const dateKeyRef=useRef(fmtKey(new Date()));
  const [,forceRender]=useState(0);
  const bump=()=>forceRender(n=>n+1);
  const dateKey=dateKeyRef.current;
  const meals=loadMeals(dateKey);
  const burned=meals.filter(m=>m.type==="workout").reduce((s,m)=>s+m.totalCalories,0);
  const effectiveGoal=baseGoal+burned;

  const changeDate=d=>{const k=fmtKey(d);if(k===dateKeyRef.current)return;dateKeyRef.current=k;bump();};
  const nowStamp = () => {
    const now=new Date();
    return { time: now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}), addedAt: now.getTime() };
  };

  // Saves the meal, then opens it so items can be added right away.
  const addMeal = async m => {
    recordItems(m.ingredients);
    const k=dateKeyRef.current;
    const raw = m.imageBase64 ? {base64:m.imageBase64, mimeType:m.imageMime||"image/jpeg"} : null;
    let storable=m;
    if (raw) {
      const thumb = await makeThumbnail(raw.base64, raw.mimeType);
      storable = {...m, imageBase64: thumb || null};
    }
    await saveMealsWithFallback(k, [...loadMeals(k), storable], raw);
    recordMealTemplate(storable);
    setSelected(storable); setScreen("detail"); bump();
  };

  const addWorkout=w=>{const k=dateKeyRef.current;saveMeals(k,[...loadMeals(k),w]);bump();};

  const updateMeal=m=>{
    const k=dateKeyRef.current;
    saveMeals(k,loadMeals(k).map(x=>x.id===m.id?m:x));
    setSelected(m);
    bump();
  };

  const deleteMeal=id=>{const k=dateKeyRef.current;saveMeals(k,loadMeals(k).filter(x=>x.id!==id));setScreen("home");bump();};


  const addFromLibrary = tpl => {
    const k=dateKeyRef.current;
    const m={
      id:uid(), mealTitle:tpl.mealTitle, emoji:tpl.emoji, summary:tpl.summary,
      totalCalories:tpl.totalCalories, totalProteinG:tpl.totalProteinG,
      totalCarbsG:tpl.totalCarbsG||0, totalFatG:tpl.totalFatG||0,
      ingredients:tpl.ingredients.map(i=>({...i})), imageBase64:null, ...nowStamp()
    };
    saveMeals(k,[...loadMeals(k),m]);
    recordMealTemplate(m); recordItems(m.ingredients);
    setSelected(m); setScreen("detail"); bump();
  };

  // Start a meal from a single saved ingredient.
  const addItemAsMeal = it => {
    const k=dateKeyRef.current;
    const ing={name:it.name,calories:it.calories,proteinG:it.proteinG||0,carbsG:it.carbsG||0,fatG:it.fatG||0,
      baseCalories:it.calories,baseProteinG:it.proteinG||0,baseCarbsG:it.carbsG||0,baseFatG:it.fatG||0,servings:1};
    const m={
      id:uid(), mealTitle:it.name, emoji:"🍽️", summary:"",
      totalCalories:it.calories, totalProteinG:it.proteinG||0,
      totalCarbsG:it.carbsG||0, totalFatG:it.fatG||0,
      ingredients:[ing], imageBase64:null, ...nowStamp()
    };
    saveMeals(k,[...loadMeals(k),m]);
    recordItems([ing]);
    setSelected(m); setScreen("detail"); bump();
  };

  const leaveDetail = () => {
    const k=dateKeyRef.current;
    const cur=loadMeals(k).find(x=>x.id===selected?.id);
    if (cur && cur.type!=="workout" && !(cur.ingredients||[]).length && !cur.totalCalories) {
      saveMeals(k, loadMeals(k).filter(x=>x.id!==cur.id));
    } else if (cur) {
      recordMealTemplate(cur);
    }
    setScreen("home"); bump();
  };

  const clearApiKey=()=>{saveKey("");setApiKey("");};
  const saveApiKey=k=>{saveKey(k);setApiKey(k);};
  const selectMeal=m=>{
    if(m._delete){const k=dateKeyRef.current;saveMeals(k,loadMeals(k).filter(x=>x.id!==m.id));bump();return;}
    setSelected(m);setScreen("detail");
  };

  if (!apiKey) return <ApiKeyScreen onSave={saveApiKey}/>;

  return <div style={{height:"100%"}}>
    {screen==="home"&&<HomeScreen
      onOpenCamera={(imageData,preview)=>{setCamImg({imageData,preview});setScreen("camera");}}
      onOpenDescribe={()=>setScreen("describe")}
      onOpenLibrary={()=>setScreen("library")}
      onAddWorkout={addWorkout} onSelectMeal={selectMeal}
      onOpenSettings={()=>setScreen("settings")}
      onOpenWeightHistory={()=>setScreen("weightHistory")}
      onOpenProgress={()=>setScreen("progress")}
      onOpenMacro={m=>{setMacroMetric(m);setScreen("macroHistory");}}
      meals={meals} goal={effectiveGoal} baseGoal={baseGoal}
      setBaseGoal={n=>{setBaseGoal(n);saveBaseGoal(n);}}
      date={new Date(dateKey+"T12:00:00")} setDate={changeDate}
    />}
    {screen==="camera"&&<PhotoScreen apiKey={apiKey} imageData={camImg.imageData} imagePreview={camImg.preview} onBack={()=>setScreen("home")} onAdd={addMeal}/>}
    {screen==="describe"&&<DescribeScreen apiKey={apiKey} onBack={()=>setScreen("home")} onAdd={addMeal}/>}
    {screen==="library"&&<LibraryScreen onBack={()=>setScreen("home")} onPickMeal={addFromLibrary} onPickItem={addItemAsMeal}/>}
    {screen==="progress"&&<ProgressScreen onBack={()=>setScreen("home")}/>}
    {screen==="detail"&&selected&&<DetailScreen meal={selected} onBack={leaveDetail} onUpdate={updateMeal} onDelete={deleteMeal} apiKey={apiKey}/>}
    {screen==="settings"&&<SettingsScreen apiKey={apiKey} onSave={saveApiKey} onClear={clearApiKey} onBack={()=>setScreen("home")} goal={effectiveGoal}/>}
    {screen==="weightHistory"&&<WeightHistoryScreen onBack={()=>setScreen("home")}/>}
    {screen==="macroHistory"&&<NutrientHistoryScreen metric={macroMetric} goal={effectiveGoal} onBack={()=>setScreen("home")}/>}
  </div>;
}

prunePhotos();

if (window.__bootTimeout) clearTimeout(window.__bootTimeout);
try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
} catch(e) {
  document.getElementById("root").innerHTML =
    '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A0A0F;color:#F0F0F8;font-family:sans-serif;padding:24px;text-align:center;gap:8px;">' +
    '<p style="font-size:32px;">⚠️</p>' +
    '<p style="font-size:15px;font-weight:600;">Something went wrong</p>' +
    '<p style="font-size:12px;opacity:0.6;max-width:280px;">' + (e.message||"Unknown error") + '</p>' +
    '<button onclick="location.reload()" style="margin-top:16px;background:#4AE68A;border:none;border-radius:10px;color:#0A0A0F;font-size:14px;font-weight:600;padding:12px 24px;">Reload</button>' +
    '</div>';
}
</script>
</body>
</html>

    <p style="font-size:14px;opacity:0.7;">Loading Just Calories…</p>

<script>
  window.__bootTimeout = setTimeout(function(){
    var el = document.getElementById('boot-fallback');
    if (el) {
      el.innerHTML = '<p style="font-size:32px;margin-bottom:8px;">⚠️</p>' +
        '<p style="font-size:15px;font-weight:600;margin-bottom:8px;">Couldn\'t load the app</p>' +
        '<p style="font-size:13px;opacity:0.6;max-width:280px;line-height:1.5;">A script failed to load. Check your connection and reload.</p>' +
        '<button onclick="location.reload()" style="margin-top:16px;background:#4AE68A;border:none;border-radius:10px;color:#0A0A0F;font-size:14px;font-weight:600;padding:12px 24px;">Reload</button>';
    }
  }, 12000);

  function showFailure(msg) {
    clearTimeout(window.__bootTimeout);
    var el = document.getElementById('boot-fallback');
    if (el) {
      el.innerHTML = '<p style="font-size:32px;margin-bottom:8px;">⚠️</p>' +
        '<p style="font-size:15px;font-weight:600;margin-bottom:8px;">Couldn\'t load required files</p>' +
        '<p style="font-size:13px;opacity:0.6;max-width:280px;line-height:1.5;">' + msg + '</p>' +
        '<button onclick="location.reload()" style="margin-top:16px;background:#4AE68A;border:none;border-radius:10px;color:#0A0A0F;font-size:14px;font-weight:600;padding:12px 24px;">Reload</button>';
    }
  }

  function loadScriptWithFallback(primaryUrl, fallbackUrl, onDone, onFail) {
    var s = document.createElement('script');
    s.src = primaryUrl;
    s.onload = onDone;
    s.onerror = function() {
      var f = document.createElement('script');
      f.src = fallbackUrl;
      f.onload = onDone;
      f.onerror = onFail;
      document.body.appendChild(f);
    };
    document.body.appendChild(s);
  }

  var scriptsToLoad = [
    ["https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js", "https://unpkg.com/react@18/umd/react.production.min.js"],
    ["https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js", "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"],
    ["https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js", "https://unpkg.com/@babel/standalone@7/babel.min.js"]
  ];

  function loadNext(i) {
    if (i >= scriptsToLoad.length) {
      try {
        var src = document.getElementById('app-source').textContent;
        // runtime:'classic' emits React.createElement. Without it, newer Babel
        // defaults to the automatic runtime and emits ESM imports, which blow up
        // inside new Function().
        var transformed = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        var runner = new Function(transformed);
        runner();
      } catch(e) {
        showFailure('The app failed to start: ' + (e.message||'unknown error') + '. Try reloading.');
      }
      return;
    }
    loadScriptWithFallback(
      scriptsToLoad[i][0],
      scriptsToLoad[i][1],
      function(){ loadNext(i+1); },
      function(){ showFailure('Both backup networks failed. Check your connection and reload.'); }
    );
  }
  loadNext(0);
</script>
<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── Storage tuning ────────────────────────────────────────────────────────
   Meal photos live in localStorage (~5MB cap) and age out. Progress photos
   live in IndexedDB, which has far more room and no retention limit — body
   photos are the whole point of keeping them for months.
   ───────────────────────────────────────────────────────────────────────────*/
const PHOTO_MAX_PX = 480;
const PHOTO_QUALITY = 0.72;
const PHOTO_RETENTION_DAYS = 14;
const ANALYSIS_MAX_PX = 1600;
const PROGRESS_MAX_PX = 900;
const PROGRESS_QUALITY = 0.82;

const ls = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k,v) => { try { localStorage.setItem(k,v); return true; } catch(e) { console.warn("localStorage write failed:",e); return false; } }
};

function makeThumbnail(base64, mimeType, size=PHOTO_MAX_PX, quality=PHOTO_QUALITY) {
  return new Promise(resolve => {
    try {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(size/img.width, size/img.height, 1);
        const w = Math.round(img.width*s), h = Math.round(img.height*s);
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.onerror = () => resolve(null);
      img.src = `data:${mimeType};base64,${base64}`;
    } catch { resolve(null); }
  });
}

function fileToImageData(file, maxPx=ANALYSIS_MAX_PX) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if (w>maxPx || h>maxPx) { const s=Math.min(maxPx/w, maxPx/h); w=Math.round(w*s); h=Math.round(h*s); }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL("image/jpeg",0.88);
        resolve({ imageData:{base64:dataUrl.split(",")[1], mimeType:"image/jpeg"}, preview:dataUrl });
      };
      img.onerror = () => resolve(null);
      img.src = ev.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

/* ─── IndexedDB: progress photos ────────────────────────────────────────────*/
const IDB_NAME="jct-progress", IDB_STORE="photos";
function idb() {
  return new Promise((res,rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:"id"});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function progressAll() {
  try {
    const db = await idb();
    return await new Promise((res,rej) => {
      const tx = db.transaction(IDB_STORE,"readonly");
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = () => res((req.result||[]).sort((a,b)=>a.takenAt-b.takenAt));
      req.onerror = () => rej(req.error);
    });
  } catch(e) { console.warn("progress read failed:",e); return []; }
}
async function progressPut(rec) {
  const db = await idb();
  return new Promise((res,rej) => {
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(rec);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function progressDelete(id) {
  const db = await idb();
  return new Promise((res,rej) => {
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}

const loadMeals = d => { try { return JSON.parse(ls.get(`jct:m:${d}`) || "[]"); } catch { return []; } };
const saveMeals = (d,m) => ls.set(`jct:m:${d}`, JSON.stringify(m));
const loadBaseGoal = () => parseInt(ls.get("jct:basegoal") || "1600");
const saveBaseGoal = g => ls.set("jct:basegoal", String(g));
const loadKey = () => ls.get("jct:apikey") || "";
const saveKey = k => ls.set("jct:apikey", k);
const loadWeights = () => { try { return JSON.parse(ls.get("jct:weights") || "[]"); } catch { return []; } };
const saveWeights = w => ls.set("jct:weights", JSON.stringify(w));
const loadWorkoutLabels = () => { try { return JSON.parse(ls.get("jct:wlabels") || "[]"); } catch { return []; } };
const saveWorkoutLabels = arr => ls.set("jct:wlabels", JSON.stringify(arr));
const loadLibrary = () => { try { return JSON.parse(ls.get("jct:lib") || "[]"); } catch { return []; } };
const saveLibrary = arr => ls.set("jct:lib", JSON.stringify(arr));
const loadItems = () => { try { return JSON.parse(ls.get("jct:items") || "[]"); } catch { return []; } };
const saveItems = arr => ls.set("jct:items", JSON.stringify(arr));

/* Macro targets. Default split is 30% protein / 40% carbs / 30% fat of the
   calorie goal; any of the three can be overridden and the override sticks. */
const MACRO_SPLIT = { protein:0.30, carbs:0.40, fat:0.30 };
const CAL_PER_G = { protein:4, carbs:4, fat:9 };
const loadMacroOverrides = () => { try { return JSON.parse(ls.get("jct:macros") || "{}"); } catch { return {}; } };
const saveMacroOverrides = o => ls.set("jct:macros", JSON.stringify(o));
function macroTargets(goal) {
  const o = loadMacroOverrides();
  const derive = k => Math.round((goal * MACRO_SPLIT[k]) / CAL_PER_G[k]);
  return {
    protein: o.protein ?? derive("protein"),
    carbs:   o.carbs   ?? derive("carbs"),
    fat:     o.fat     ?? derive("fat")
  };
}

const fmtKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtDisplay = d => d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const isToday = d => fmtKey(d) === fmtKey(new Date());
const shortDate = ts => new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric"});

function prunePhotos() {
  try {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - PHOTO_RETENTION_DAYS);
    const cutKey = fmtKey(cutoff);
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith("jct:m:")) continue;
      if (key.slice(6) >= cutKey) continue;
      const meals = JSON.parse(localStorage.getItem(key) || "[]");
      if (!meals.some(m => m.imageBase64)) continue;
      localStorage.setItem(key, JSON.stringify(meals.map(m => ({...m, imageBase64: null}))));
    }
  } catch(e) { console.warn("photo prune failed:", e); }
}

async function saveMealsWithFallback(dateKey, meals, rawImage) {
  if (saveMeals(dateKey, meals)) return true;
  if (rawImage?.base64) {
    const small = await makeThumbnail(rawImage.base64, rawImage.mimeType||"image/jpeg", 200, 0.6);
    const retry = meals.map((m,i) => i===meals.length-1 ? {...m, imageBase64:small} : m);
    if (saveMeals(dateKey, retry)) return true;
  }
  const stripped = meals.map((m,i) => i===meals.length-1 ? {...m, imageBase64:null} : m);
  return saveMeals(dateKey, stripped);
}

async function analyze(apiKey, imageData, description) {
  if (!apiKey) throw new Error("No API key — tap ⚙️ Settings to add your OpenAI key");

  const sysPrompt = `You are an expert nutritionist and food label reader with access to USDA databases, restaurant nutrition facts, and packaged food data.

BARCODE & PACKAGING:
- If you see a barcode, UPC, or food package: read ALL visible text including brand name, product name, flavor, size, and any nutrition panel. Use the EXACT published nutrition facts for that specific product.
- Examples: Fairlife 2% milk 11.5oz = 170cal/13g protein. Premier Protein shake = 160cal/30g protein. Kind bar peanut butter = 200cal/7g protein.

RESTAURANT & BRAND FOOD:
- Use real published nutrition data. Examples: Big Mac = 550cal/25g protein. Chipotle chicken burrito bowl (standard) ~800cal/50g protein. Starbucks grande latte whole milk = 220cal/12g protein.

HOMEMADE / PLATED FOOD:
- Estimate the ACTUAL portion size visible in the photo. Look for visual cues: plate size, utensils, food density.
- Never default to a "standard serving" — judge what's actually in the image.

QUANTITIES — IMPORTANT:
- Put the count in the "servings" field, never in the item name. Two crunchy tacos = {"name":"Taco Bell Crunchy Taco","servings":2,...}, NOT {"name":"Crunchy Taco x2","servings":1,...}.
- calories, proteinG, carbsG and fatG on each ingredient are the values for ONE serving, not the combined total.
- If the user says "two", "3x", "a dozen" etc, set servings to that number and keep the per-unit values unchanged.
- Use servings 1 with a descriptive name for a single portion of something ("large bowl of chili").

ACCURACY RULES:
- Never return 0 calories for any real food item.
- totalCalories MUST equal the sum of (calories × servings) across all ingredients.
- Estimate proteinG, carbsG and fatG for EVERY ingredient, and the totals.
- Macros should be roughly consistent with calories (protein 4 cal/g, carbs 4 cal/g, fat 9 cal/g).
- For emoji: pick ONE emoji that best represents the main food item.
- Return ONLY raw JSON. No markdown fences, no explanation text, nothing else.`;

  const shape = `{"mealTitle":"...","totalCalories":0,"totalProteinG":0,"totalCarbsG":0,"totalFatG":0,"emoji":"🍔","ingredients":[{"name":"...","servings":1,"calories":0,"proteinG":0,"carbsG":0,"fatG":0}],"summary":"..."}`;

  const userPrompt = imageData
    ? `Analyze this image carefully.${description ? ` User added: "${description}".` : ""} If you see a barcode or package, identify the exact product and use its real nutrition facts. Return this exact JSON: ${shape}`
    : `The user described their meal: "${description}". Use real brand/USDA data and multiply by any stated quantity. Return this exact JSON: ${shape}`;

  const contentArr = [];
  if (imageData) {
    contentArr.push({
      type: "image_url",
      image_url: { url: `data:${imageData.mimeType};base64,${imageData.base64}`, detail: "high" }
    });
  }
  contentArr.push({ type: "text", text: userPrompt });

  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
    body: JSON.stringify({
      model: "gpt-5.5",
      messages: [
        { role: "system", content: sysPrompt },
        { role: "user", content: contentArr }
      ],
      max_completion_tokens: 900
    })
  });

  if (!res.ok) {
    let msg = `API error ${res.status}`;
    try { const e = await res.json(); msg = e.error?.message || msg; } catch {}
    if (res.status === 401) throw new Error("Invalid API key — tap ⚙️ to update it");
    if (res.status === 400) throw new Error(`Bad request: ${msg}`);
    if (res.status === 429) throw new Error("Rate limit — wait a moment and try again");
    throw new Error(msg);
  }

  const data = await res.json();
  const rawText = data.choices?.[0]?.message?.content || "";
  const cleaned = rawText.trim().replace(/```json\s*/gi,"").replace(/```/g,"").trim();
  try { return JSON.parse(cleaned); }
  catch {
    const match = cleaned.match(/\{[\s\S]*\}/);
    if (match) return JSON.parse(match[0]);
    throw new Error("Unexpected response — please try again");
  }
}

/* ─── Recent ingredients ────────────────────────────────────────────────────
   Ordered by how often an item has been picked, then by how recently. New
   items start at 1 use, so the list reads newest-first until picks accumulate
   and the ones actually reused float to the top.
   ───────────────────────────────────────────────────────────────────────────*/
function itemSort(a,b) { return (b.uses||0)-(a.uses||0) || (b.lastUsed||0)-(a.lastUsed||0); }

function recordItems(ingredients, countAsUse=true) {
  if (!ingredients?.length) return;
  const list = loadItems();
  const map = {};
  list.forEach(f => { map[f.key] = f; });
  ingredients.forEach(f => {
    if (!f?.name) return;
    const key = f.name.trim().toLowerCase();
    if (!key) return;
    const prior = map[key];
    map[key] = {
      key, name: f.name.trim(),
      calories: f.baseCalories ?? f.calories ?? 0,
      proteinG: f.baseProteinG ?? f.proteinG ?? 0,
      carbsG:   f.baseCarbsG   ?? f.carbsG   ?? 0,
      fatG:     f.baseFatG     ?? f.fatG     ?? 0,
      uses: (prior?.uses || 0) + (countAsUse ? 1 : 0),
      lastUsed: Date.now()
    };
  });
  saveItems(Object.values(map).sort(itemSort).slice(0,150));
}

function recordMealTemplate(meal) {
  if (!meal || meal.type === "workout") return;
  const title = (meal.mealTitle||"").trim();
  if (!title || title.toLowerCase() === "new meal" || !(meal.totalCalories > 0)) return;
  const lib = loadLibrary();
  const key = title.toLowerCase();
  const prior = lib.find(t => t.key === key);
  const entry = {
    key, mealTitle: title, emoji: meal.emoji || "🍽️",
    totalCalories: meal.totalCalories,
    totalProteinG: meal.totalProteinG || 0,
    totalCarbsG: meal.totalCarbsG || 0,
    totalFatG: meal.totalFatG || 0,
    summary: meal.summary || "",
    ingredients: (meal.ingredients||[]).map(i => ({
      name: i.name, calories: i.calories,
      proteinG: i.proteinG || 0, carbsG: i.carbsG || 0, fatG: i.fatG || 0,
      baseCalories: i.baseCalories ?? i.calories,
      baseProteinG: i.baseProteinG ?? (i.proteinG || 0),
      baseCarbsG: i.baseCarbsG ?? (i.carbsG || 0),
      baseFatG: i.baseFatG ?? (i.fatG || 0),
      servings: i.servings ?? 1
    })),
    lastUsed: Date.now(),
    uses: (prior?.uses || 0) + 1
  };
  saveLibrary([entry, ...lib.filter(t => t.key !== key)].sort(itemSort).slice(0, 80));
}

/* ─── Speech ────────────────────────────────────────────────────────────────
   ONE SpeechRecognition instance for the whole app. Building a new one on every
   start() causes repeat permission prompts within a session — reusing this keeps
   the first grant alive until the app is fully closed. iOS still asks once per
   app launch; that's an OS rule with no workaround.
   ───────────────────────────────────────────────────────────────────────────*/
let _rec = null;
function getRecognizer() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  if (!_rec) {
    _rec = new SR();
    _rec.continuous = true;
    _rec.interimResults = true;
    _rec.lang = "en-US";
  }
  return _rec;
}

function useWebSpeech(onUpdate) {
  const [listening, setListening] = useState(false);
  const supported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const activeRef = useRef(false);

  const start = useCallback(() => {
    if (!supported || activeRef.current) return;
    const rec = getRecognizer();
    if (!rec) return;
    let final = "";
    rec.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t + " ";
        else interim = t;
      }
      onUpdate(final + interim);
    };
    // onstart fires only once the OS actually hands over audio, so the UI never
    // shows "listening" while the permission dialog is still up.
    rec.onstart = () => { activeRef.current = true; setListening(true); };
    rec.onerror = () => { activeRef.current = false; setListening(false); };
    rec.onend   = () => { activeRef.current = false; setListening(false); };
    try { rec.start(); } catch { /* already running */ }
  }, [supported, onUpdate]);

  const stop = useCallback(() => {
    try { _rec?.stop(); } catch {}
    activeRef.current = false;
    setListening(false);
  }, []);

  return { listening, supported, start, stop };
}

/* Listening indicator. Deliberately not a waveform — reading real levels needs
   getUserMedia, a second permission prompt. This shows recording state only;
   the live transcript is the real feedback. */
function ListeningBars({active}) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const BARS = 24;
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const flat = () => {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const bw = canvas.width/BARS;
      ctx.fillStyle = "rgba(74,230,138,0.18)";
      for (let i=0;i<BARS;i++){ ctx.beginPath(); ctx.roundRect(i*bw+1,(canvas.height-4)/2,bw-2,4,2); ctx.fill(); }
    };
    if (!active) { cancelAnimationFrame(rafRef.current); flat(); return; }
    let t = 0;
    const animate = () => {
      rafRef.current = requestAnimationFrame(animate);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const bw=canvas.width/BARS, maxH=canvas.height*0.88;
      for (let i=0;i<BARS;i++){
        const v=Math.abs(Math.sin(t*2.1+i*0.4))*0.55+0.12;
        const h=Math.max(4,v*maxH);
        ctx.fillStyle=`rgba(74,230,138,${0.22+v*0.55})`;
        ctx.beginPath(); ctx.roundRect(i*bw+1,(canvas.height-h)/2,bw-2,h,3); ctx.fill();
      }
      t+=0.05;
    };
    animate();
    return () => cancelAnimationFrame(rafRef.current);
  }, [active]);
  return <div style={{width:"100%",height:52,display:"flex",alignItems:"center"}}>
    <canvas ref={canvasRef} width={340} height={52} style={{width:"100%",height:"100%",opacity:active?1:0.3,transition:"opacity 0.3s"}}/>
  </div>;
}

/* Roll up the last n days of logged food into per-day macro totals.
   Workouts are excluded — they subtract calories, not add macros. */
function collectDays(n=30) {
  const out=[];
  for (let i=n-1;i>=0;i--) {
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=fmtKey(d);
    const food=loadMeals(key).filter(m=>m.type!=="workout");
    out.push({
      date:key,
      calories: food.reduce((s,m)=>s+(m.totalCalories||0),0),
      protein:  Math.round(food.reduce((s,m)=>s+(m.totalProteinG||0),0)),
      carbs:    Math.round(food.reduce((s,m)=>s+(m.totalCarbsG||0),0)),
      fat:      Math.round(food.reduce((s,m)=>s+(m.totalFatG||0),0))
    });
  }
  return out;
}

function MacroMini({label,value,target,color,onOpen}) {

/* Full-width weight chart with min/max labels and a 7-day delta. */
function WeightChart({data,height=84}) {
  if (!data.length) return null;
  const pts = data.slice(-30);
  if (pts.length < 2) return <p style={{fontSize:11,fontWeight:300,color:C.dim}}>Log another day to see the trend</p>;
  const W=320,H=84,PX=6,PY=10;
  const vals=pts.map(d=>d.value);
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const lo=mn-0.4, hi=mx+0.4, range=hi-lo||1;
  const tx=i=>PX+(i/(pts.length-1))*(W-PX*2);
  const ty=v=>PY+(1-(v-lo)/range)*(H-PY*2);
  const line=pts.map((d,i)=>`${tx(i)},${ty(d.value)}`).join(" ");
  const area=`M${tx(0)},${ty(pts[0].value)} `+pts.slice(1).map((d,i)=>`L${tx(i+1)},${ty(d.value)}`).join(" ")+` L${tx(pts.length-1)},${H} L${tx(0)},${H} Z`;
  const last=pts[pts.length-1].value;
  const trendDown = last <= pts[0].value;
  const color = trendDown ? C.accent : C.orange;
  return <div style={{width:"100%"}}>
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:"100%",height,display:"block"}}>
      <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity="0.28"/><stop offset="100%" stopColor={color} stopOpacity="0"/>
      </linearGradient></defs>
      <path d={area} fill="url(#wg)"/>
      <polyline points={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
      <circle cx={tx(pts.length-1)} cy={ty(last)} r="3.5" fill={color}/>
    </svg>
    <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
      <span style={{fontSize:10,fontWeight:300,color:C.dim}}>{shortDate(new Date(pts[0].date+"T12:00:00").getTime())} · {pts[0].value}</span>
      <span style={{fontSize:10,fontWeight:300,color:C.dim}}>range {mn}–{mx} lbs</span>
    </div>
  </div>;
}

function MealCard({meal,onTap,onDelete}) {
  const [swipeX,setSwipeX]=useState(0);
  const [swiping,setSwiping]=useState(false);
  const tx=useRef(0),ty=useRef(0);
  const isWorkout=meal.type==="workout";
  const THRESHOLD=80;
  const srvSummary = !isWorkout && meal.ingredients?.length
    ? meal.ingredients.map(i=>`${i.name}${i.servings && i.servings!==1 ? ` ×${i.servings}` : ""}`).slice(0,3).join(" · ") + (meal.ingredients.length>3?" …":"")
    : null;
  const onTS=e=>{tx.current=e.touches[0].clientX;ty.current=e.touches[0].clientY;setSwiping(false);};
  const onTM=e=>{const dx=e.touches[0].clientX-tx.current;const dy=Math.abs(e.touches[0].clientY-ty.current);if(dy>20&&Math.abs(dx)<20)return;if(dx<0){setSwiping(true);setSwipeX(Math.max(dx,-(THRESHOLD+30)));}};
  const onTE=()=>{if(swipeX<=-THRESHOLD){onDelete(meal.id);}else{setSwipeX(0);setSwiping(false);}};
  return <div style={{position:"relative",marginBottom:10,borderRadius:16,overflow:"hidden"}}>
    <div style={{position:"absolute",inset:0,background:C.red,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:20}}>
      <span style={{color:"#fff",fontSize:13,fontWeight:400,marginRight:6}}>Delete</span><IcTrash/>
    </div>
    <div style={{display:"flex",alignItems:"center",gap:12,background:C.card,border:`1px solid ${isWorkout?C.oMid:C.border}`,borderRadius:16,padding:"12px 14px",cursor:"pointer",transform:`translateX(${swipeX}px)`,transition:swiping?"none":"transform 0.3s ease"}}
      onClick={()=>{if(swipeX===0)onTap(meal);}}
      onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}>
      {meal.imageBase64
        ?<img src={`data:${meal.imageMime||"image/jpeg"};base64,${meal.imageBase64}`} style={{width:48,height:48,borderRadius:10,objectFit:"cover",flexShrink:0}} alt=""/>
        :<div style={{width:48,height:48,borderRadius:10,background:isWorkout?C.oDim:C.hover,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:20}}>{isWorkout?"🔥":meal.emoji||"🍽️"}</span></div>
      }
      <div style={{flex:1,minWidth:0}}>
        <p style={{fontSize:13,fontWeight:400,color:isWorkout?C.orange:C.text,marginBottom:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{meal.mealTitle}</p>
        <p style={{fontSize:11,fontWeight:300,color:C.sub,lineHeight:1.4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:1}}>{srvSummary || meal.summary}</p>
        <p style={{fontSize:10,fontWeight:300,color:C.dim,marginTop:2}}>{meal.time}</p>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3,flexShrink:0,paddingLeft:8}}>
        <div style={{display:"flex",alignItems:"baseline",gap:3,padding:"6px 10px",background:isWorkout?C.oDim:C.aDim,borderRadius:10}}>
          <span style={{fontSize:18,fontWeight:200,color:isWorkout?C.orange:C.accent,letterSpacing:"-0.5px"}}>{isWorkout?"-":""}{meal.totalCalories}</span>
          <span style={{fontSize:9,fontWeight:300,color:isWorkout?C.oMid:C.aMid,textTransform:"uppercase"}}>cal</span>
        </div>
        {!isWorkout&&<div style={{display:"flex",gap:6}}>
          {(meal.totalProteinG||0)>0&&<span style={{fontSize:9,fontWeight:300,color:C.protein}}>{Math.round(meal.totalProteinG)}p</span>}
          {(meal.totalCarbsG||0)>0&&<span style={{fontSize:9,fontWeight:300,color:C.carbs}}>{Math.round(meal.totalCarbsG)}c</span>}
          {(meal.totalFatG||0)>0&&<span style={{fontSize:9,fontWeight:300,color:C.fat}}>{Math.round(meal.totalFatG)}f</span>}
        </div>}
      </div>
    </div>
  </div>;
}

    const t=val.trim();

function HomeScreen({onOpenCamera,onOpenDescribe,onOpenLibrary,onSelectMeal,onAddWorkout,onOpenSettings,onOpenWeightHistory,onOpenProgress,onOpenMacro,meals,goal,baseGoal,setBaseGoal,date,setDate}) {
  const [editGoal,setEditGoal]=useState(false);
  const [goalVal,setGoalVal]=useState(String(baseGoal));
  const [weightLog,setWeightLog]=useState(()=>loadWeights());
  const [editWeight,setEditWeight]=useState(false);
  const [weightVal,setWeightVal]=useState("");
  const [showWorkout,setShowWorkout]=useState(false);
  const fileRef=useRef();

  const food = meals.filter(m=>m.type!=="workout");
  const eaten = food.reduce((s,m)=>s+m.totalCalories,0);
  const burned = meals.filter(m=>m.type==="workout").reduce((s,m)=>s+m.totalCalories,0);
  const protein = food.reduce((s,m)=>s+(m.totalProteinG||0),0);
  const carbs = food.reduce((s,m)=>s+(m.totalCarbsG||0),0);
  const fat = food.reduce((s,m)=>s+(m.totalFatG||0),0);
  const targets = macroTargets(goal);
  const latestW = weightLog.length>0 ? weightLog[weightLog.length-1].value : 0;
  const calPct = goal>0 ? Math.min(eaten/goal,1) : 0;
  const overCal = eaten > goal;
  const remaining = goal - eaten;

  // Delta against the closest reading at least 7 days back.
  const weekDelta = (() => {
    if (weightLog.length<2) return null;
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
    const key = fmtKey(cutoff);
    const older = weightLog.filter(w=>w.date<=key);
    const ref = older.length ? older[older.length-1] : weightLog[0];
    const d = Math.round((latestW-ref.value)*10)/10;
    return d===0 ? null : d;
  })();

  const commitGoal=()=>{const n=parseInt(goalVal);if(!isNaN(n)&&n>0){setBaseGoal(n);saveBaseGoal(n);}else setGoalVal(String(baseGoal));setEditGoal(false);};
  const commitWeight=()=>{const n=parseFloat(weightVal);if(!isNaN(n)&&n>0){const entry={date:fmtKey(new Date()),value:n};const next=[...weightLog.filter(w=>w.date!==entry.date),entry].sort((a,b)=>a.date.localeCompare(b.date));setWeightLog(next);saveWeights(next);}setEditWeight(false);};
  const shift=days=>{const d=new Date(date);d.setDate(d.getDate()+days);setDate(d);};

  return <div style={{height:"100%",background:C.bg,overflowY:"auto",paddingBottom:"calc(env(safe-area-inset-bottom,12px) + 104px)"}}>
    <div style={{padding:"env(safe-area-inset-top,44px) 20px 0",background:`linear-gradient(180deg,${C.surface} 0%,${C.bg} 100%)`}}>
      <div style={{paddingTop:12,display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:20}}>⚡</span>
          <span style={{fontSize:17,fontWeight:500,color:C.text,letterSpacing:"-0.3px"}}>Just Calories</span>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button style={{width:36,height:36,borderRadius:10,background:C.hover,border:`1px solid ${C.border}`,color:C.sub,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={onOpenProgress}><IcPerson size={18}/></button>
          <button style={{width:36,height:36,borderRadius:10,background:C.hover,border:`1px solid ${C.border}`,color:C.sub,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={onOpenSettings}><IcGear/></button>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <button style={{width:34,height:34,borderRadius:10,background:C.hover,border:`1px solid ${C.border}`,color:C.sub,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>shift(-1)}><IcLeft/></button>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
          <span style={{fontSize:14,fontWeight:400,color:C.text}}>{fmtDisplay(date)}</span>
          {!isToday(date)&&<button style={{background:C.aDim,border:`1px solid ${C.aMid}`,color:C.accent,borderRadius:20,fontSize:11,fontWeight:500,padding:"3px 12px"}} onClick={()=>setDate(new Date())}>← Back to today</button>}
        </div>
        <button style={{width:34,height:34,borderRadius:10,background:C.hover,border:`1px solid ${C.border}`,color:C.sub,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>shift(1)}><IcRight/></button>
      </div>
    </div>

    <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={async e=>{
      const f=e.target.files[0]; e.target.value=""; if(!f) return;
      const r=await fileToImageData(f);
      if(r) onOpenCamera(r.imageData, r.preview);
    }}/>

    {/* ── Calories + macros, full width ── */}
    <div style={{padding:"0 16px 12px"}}>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:20,padding:"18px 20px"}}>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:12}}>
          <div>
            <span style={{fontSize:10,fontWeight:400,color:C.dim,textTransform:"uppercase",letterSpacing:"1px"}}>Calories</span>
            <div style={{display:"flex",alignItems:"baseline",gap:5,marginTop:4}}>
              <span style={{fontSize:38,fontWeight:200,color:C.text,letterSpacing:"-2px",lineHeight:1}}>{eaten}</span>
              <span style={{fontSize:18,color:C.dim,fontWeight:300}}>/</span>
              {editGoal
                ?<input autoFocus type="number" inputMode="numeric" style={{background:"transparent",border:"none",borderBottom:`2px solid ${C.accent}`,color:C.text,fontSize:24,fontWeight:200,fontFamily:"'Inter',sans-serif",letterSpacing:"-0.5px",outline:"none",padding:0,width:80,lineHeight:1}} value={goalVal} onChange={e=>setGoalVal(e.target.value)} onBlur={commitGoal} onKeyDown={e=>e.key==="Enter"&&commitGoal()}/>
                :<span style={{fontSize:22,fontWeight:200,color:C.sub,letterSpacing:"-0.5px",cursor:"pointer"}} onClick={()=>{setGoalVal(String(baseGoal));setEditGoal(true);}}>{goal}</span>
              }
              {!editGoal&&<span style={{color:C.dim,cursor:"pointer",display:"inline-flex",marginLeft:2}} onClick={()=>{setGoalVal(String(baseGoal));setEditGoal(true);}}><IcEdit/></span>}
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <span style={{fontSize:20,fontWeight:200,color:overCal?C.orange:C.accent,letterSpacing:"-0.5px"}}>{overCal?"+":""}{Math.abs(remaining)}</span>
            <p style={{fontSize:9,color:C.dim,fontWeight:300,textTransform:"uppercase",letterSpacing:"0.5px",marginTop:2}}>{overCal?"over":"left"}</p>
          </div>
        </div>
        <div style={{height:7,borderRadius:4,background:C.track,overflow:"hidden",marginBottom:6}}>
          <div style={{width:`${calPct*100}%`,height:"100%",background:overCal?C.orange:C.accent,borderRadius:4,transition:"width 0.35s ease"}}/>
        </div>
        <p style={{fontSize:10,color:C.dim,fontWeight:300,marginBottom:14}}>{editGoal?"enter base goal, then return":burned>0?`${baseGoal} base + ${burned} burned`:"tap the goal to change it"}</p>
        <div style={{display:"flex",gap:14}}>
          <MacroMini label="Protein" value={protein} target={targets.protein} color={C.protein} onOpen={()=>onOpenMacro("protein")}/>
          <MacroMini label="Carbs" value={carbs} target={targets.carbs} color={C.carbs} onOpen={()=>onOpenMacro("carbs")}/>
          <MacroMini label="Fat" value={fat} target={targets.fat} color={C.fat} onOpen={()=>onOpenMacro("fat")}/>
        </div>
      </div>
    </div>

    {/* ── Weight, full width ── */}
    <div style={{padding:"0 16px 16px"}}>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:20,padding:"18px 20px"}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:10}}>
          <div>
            <span style={{fontSize:10,fontWeight:400,color:C.dim,textTransform:"uppercase",letterSpacing:"1px"}}>Weight</span>
            <div style={{display:"flex",alignItems:"baseline",gap:6,marginTop:4}}>
              {editWeight
                ?<input autoFocus type="number" inputMode="decimal" style={{background:"transparent",border:"none",borderBottom:`2px solid ${C.accent}`,color:C.text,fontSize:32,fontWeight:200,fontFamily:"'Inter',sans-serif",letterSpacing:"-1.5px",outline:"none",padding:0,width:100,lineHeight:1}} placeholder="0" value={weightVal} onChange={e=>setWeightVal(e.target.value)} onBlur={commitWeight} onKeyDown={e=>e.key==="Enter"&&commitWeight()}/>
                :<span style={{fontSize:32,fontWeight:200,color:C.text,letterSpacing:"-1.5px",lineHeight:1,cursor:"pointer"}} onClick={()=>{setWeightVal(latestW>0?String(latestW):"");setEditWeight(true);}}>{latestW>0?latestW:"—"}</span>
              }
              <span style={{fontSize:12,fontWeight:300,color:C.dim}}>lbs</span>
              {!editWeight&&<span style={{color:C.dim,cursor:"pointer",display:"inline-flex"}} onClick={()=>{setWeightVal(latestW>0?String(latestW):"");setEditWeight(true);}}><IcEdit/></span>}
              {weekDelta!==null&&!editWeight&&<span style={{fontSize:12,fontWeight:300,color:weekDelta<0?C.accent:C.orange,marginLeft:2}}>
                {weekDelta<0?"↓":"↑"}{Math.abs(weekDelta)} / 7d
              </span>}
            </div>
          </div>
          <button style={{display:"flex",alignItems:"center",gap:3,background:"none",border:"none",color:C.dim,fontSize:11,padding:"4px 0"}} onClick={onOpenWeightHistory}>History <IcRight/></button>
        </div>
        {weightLog.length>=2
          ? <WeightChart data={weightLog} height={58}/>
          : <p style={{fontSize:11,fontWeight:300,color:C.dim,paddingTop:4}}>{editWeight?"lbs, then return":"Log two days to see the trend"}</p>}
      </div>
    </div>

    <div style={{padding:"0 16px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{fontSize:15,fontWeight:500,color:C.text}}>Meals & workouts</span>
        <span style={{fontSize:12,color:C.dim}}>{meals.length} {meals.length===1?"entry":"entries"}</span>
      </div>
      {meals.length===0
        ?<div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"48px 20px",gap:10}}>
          <span style={{fontSize:36}}>🍽️</span>
          <p style={{color:C.sub,fontSize:14,textAlign:"center",lineHeight:1.6}}>Nothing logged yet.<br/>Say what you ate, snap a photo, or reuse a recent meal.</p>
        </div>
        :[...meals].reverse().map(m=><MealCard key={m.id} meal={m} onTap={onSelectMeal} onDelete={id=>onSelectMeal({...m,_delete:true})}/>)
      }
    </div>
    {showWorkout&&<WorkoutModal onAdd={w=>{onAddWorkout(w);setShowWorkout(false);}} onClose={()=>setShowWorkout(false)}/>}

    {/* Docked action bar — fixed to the viewport so it stays under your thumb
        no matter how far down the meal list you've scrolled. */}
    <div style={{position:"fixed",left:0,right:0,bottom:0,zIndex:50,
      padding:"10px 16px calc(env(safe-area-inset-bottom,12px) + 10px)",
      background:`linear-gradient(180deg, rgba(10,10,15,0) 0%, ${C.bg} 22%)`}}>
      <div style={{display:"flex",gap:8}}>
        <ActionBtn onClick={onOpenDescribe} tone="accent" icon={<IcMic/>} label="Say it"/>
        <ActionBtn onClick={()=>fileRef.current.click()} icon={<IcCamera/>} label="Photo"/>
        <ActionBtn onClick={onOpenLibrary} icon={<IcStack/>} label="Recent"/>
        <ActionBtn onClick={()=>setShowWorkout(true)} tone="orange" icon={<span style={{fontSize:22,lineHeight:"22px"}}>🔥</span>} label="Workout"/>
      </div>
    </div>
  </div>;
}

/* Say the meal, land straight in its detail page to add items. */
function DescribeScreen({apiKey,onBack,onAdd}) {
  const [text,setText]=useState("");
  const [error,setError]=useState("");
  const [submitting,setSubmitting]=useState(false);
  const baseRef=useRef("");

  const onUpdate=useCallback(t=>setText(baseRef.current+t),[]);
  const speech=useWebSpeech(onUpdate);
  const startMic=()=>{ baseRef.current = text ? text.replace(/\s+$/,"")+" " : ""; speech.start(); };

  useEffect(()=>{
    const id=setTimeout(()=>{ baseRef.current=""; speech.start(); },250);
    return ()=>{ clearTimeout(id); speech.stop(); };
  },[]);

  const submit = async () => {
    if (!text.trim()) return;
    speech.stop();
    setSubmitting(true);
    try {
      const r = await analyze(apiKey, null, text);
      const now = new Date();
      onAdd({
        id:uid(), mealTitle:r.mealTitle, totalCalories:r.totalCalories,
        totalProteinG:r.totalProteinG||0, totalCarbsG:r.totalCarbsG||0, totalFatG:r.totalFatG||0,
        ingredients:r.ingredients||[], summary:r.summary, imageBase64:null,
        time:now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),
        addedAt:now.getTime(), emoji:r.emoji||"🍽️"
      });
    } catch(e) { setError(e.message||"Something went wrong — check Settings ⚙️"); setSubmitting(false); }
  };

  if (submitting) return <Spinner text="Building your meal…"/>;

  return <div style={{height:"100%",background:C.bg,overflowY:"auto",paddingBottom:40}}>
    <StickyHeader left={<HeaderBtn onClick={()=>{speech.stop();onBack();}}><IcBack/></HeaderBtn>} title="Say what you ate"/>
    <div style={{display:"flex",flexDirection:"column",gap:14,padding:"12px 20px 40px"}}>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:12,paddingTop:6}}>
        <div onClick={speech.listening?speech.stop:startMic}
          style={{width:96,height:96,borderRadius:"50%",background:speech.listening?"rgba(255,68,68,0.12)":"rgba(74,230,138,0.1)",border:`2px solid ${speech.listening?C.red:C.accent}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"all 0.3s",boxShadow:speech.listening?"0 0 0 12px rgba(255,68,68,0.06)":"0 0 0 12px rgba(74,230,138,0.06)"}}>
          <div style={{color:speech.listening?C.red:C.accent}}>{speech.listening?<IcStop size={30}/>:<IcMic size={38}/>}</div>
        </div>
        <p style={{fontSize:14,fontWeight:300,color:speech.listening?C.red:C.sub,textAlign:"center"}}>
          {!speech.supported?"Type what you ate below":speech.listening?"Listening — tap to stop":"Tap to speak"}
        </p>
      </div>
      <ListeningBars active={speech.listening}/>
      <textarea style={{width:"100%",minHeight:100,background:C.surface,border:`1px solid ${text?C.aMid:C.border}`,borderRadius:14,color:text?C.text:C.sub,fontSize:15,padding:"14px 16px",resize:"none",outline:"none",fontFamily:"'Inter',sans-serif",lineHeight:1.65,transition:"border-color 0.2s"}}
        placeholder={speech.supported?"Words appear here as you speak — e.g. \"a salad with chicken\"":"e.g. a salad with chicken"}
        value={text} onChange={e=>setText(e.target.value)}/>
      <p style={{fontSize:11,fontWeight:300,color:C.dim,lineHeight:1.6,textAlign:"center"}}>You'll land on the meal page next, where you can photograph each item.</p>
      {error&&<div style={{background:C.rDim,border:`1px solid ${C.rMid}`,borderRadius:12,padding:"12px 14px"}}>
        <p style={{color:C.red,fontSize:13,fontWeight:500,lineHeight:1.5}}>⚠ {error}</p>
      </div>}
      <button style={{width:"100%",background:C.accent,border:"none",borderRadius:14,color:C.bg,fontSize:15,fontWeight:500,padding:"16px",opacity:text.trim()?1:0.3}} onClick={submit} disabled={!text.trim()}>
        {error?"Try again →":"Create meal →"}
      </button>
    </div>
  </div>;
}

function PhotoScreen({apiKey,imageData,imagePreview,onBack,onAdd}) {
  const [note,setNote]=useState("");
  const [error,setError]=useState("");
  const [submitting,setSubmitting]=useState(false);
  const baseRef=useRef("");

  const onUpdate=useCallback(t=>setNote(baseRef.current+t),[]);
  const speech=useWebSpeech(onUpdate);
  const startMic=()=>{ baseRef.current = note ? note.replace(/\s+$/,"")+" " : ""; speech.start(); };
  useEffect(()=>()=>speech.stop(),[]);

  const submit = async () => {
    speech.stop();
    setError("");
    setSubmitting(true);
    try {
      const r = await analyze(apiKey, imageData, note || undefined);
      const now = new Date();
      onAdd({
        id:uid(), mealTitle:r.mealTitle, totalCalories:r.totalCalories,
        totalProteinG:r.totalProteinG||0, totalCarbsG:r.totalCarbsG||0, totalFatG:r.totalFatG||0,
        ingredients:r.ingredients||[], summary:r.summary,
        imageBase64:imageData?.base64||null, imageMime:imageData?.mimeType||"image/jpeg",
        time:now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),
        addedAt:now.getTime(), emoji:r.emoji||null
      });
    } catch(e) {
      setError(e.message || "Analysis failed — check Settings ⚙️");
      setSubmitting(false);
    }
  };

  if (submitting && !error) return <Spinner text="Analyzing with GPT-5.5…"/>;

  return <div style={{height:"100%",background:C.bg,display:"flex",flexDirection:"column"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"calc(env(safe-area-inset-top,44px) + 8px) 16px 8px",flexShrink:0}}>

      <span style={{fontSize:16,fontWeight:500,color:C.text}}>Add meal photo</span>
      <div style={{width:40}}/>
    </div>
    {imagePreview&&<div style={{flex:1,minHeight:0,padding:"0 16px 8px"}}>
      <img src={imagePreview} style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:16,border:`1px solid ${C.border}`,display:"block"}} alt=""/>
    </div>}
    <div style={{flexShrink:0,padding:"0 16px calc(env(safe-area-inset-bottom,16px) + 12px)",display:"flex",flexDirection:"column",gap:8}}>
      {speech.supported&&<div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:C.surface,borderRadius:14,border:`1px solid ${C.border}`}}>
        <div onClick={speech.listening?speech.stop:startMic}
          style={{width:40,height:40,borderRadius:"50%",flexShrink:0,background:speech.listening?"rgba(255,68,68,0.12)":"rgba(74,230,138,0.1)",border:`2px solid ${speech.listening?C.red:C.accent}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"all 0.3s"}}>

function SwipeIngRow({ing,idx,editIdx,editField,servVal,calVal,setServVal,setCalVal,setEditIdx,commitServ,commitCal,onDelete}) {
  const [swipeX,setSwipeX]=useState(0);const[swiping,setSwiping]=useState(false);
  const tx=useRef(0),ty=useRef(0);const THRESHOLD=70;
  const onTS=e=>{tx.current=e.touches[0].clientX;ty.current=e.touches[0].clientY;setSwiping(false);setSwipeX(0);};
  const onTM=e=>{const dx=e.touches[0].clientX-tx.current;const dy=Math.abs(e.touches[0].clientY-ty.current);if(dy>20&&Math.abs(dx)<20)return;if(dx<-8){setSwiping(true);setSwipeX(Math.max(dx,-(THRESHOLD+20)));}};
  const onTE=e=>{
    const dx=Math.abs(e.changedTouches[0].clientX-tx.current);
    if(dx<8){setSwipeX(0);setSwiping(false);return;}
    if(swipeX<=-THRESHOLD)onDelete(idx);else{setSwipeX(0);setSwiping(false);}
  };
  const servings = ing.servings ?? 1;
  const editingServ = editIdx===idx && editField==="serv";
  const editingCal  = editIdx===idx && editField==="cal";
  return <div style={{position:"relative",overflow:"hidden",borderTop:`1px solid ${C.border}`}}>
    <div style={{position:"absolute",inset:0,background:C.red,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:16}}>
      <span style={{color:"#fff",fontSize:12,fontWeight:400,marginRight:4}}>Delete</span><IcTrash/>
    </div>
    <div style={{padding:"10px 16px",background:C.surface,transform:`translateX(${swipeX}px)`,transition:swiping?"none":"transform 0.3s ease"}}
      onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}>
      <p style={{fontSize:11,fontWeight:300,color:C.sub,marginBottom:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ing.name}</p>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"baseline",gap:4,cursor:"pointer"}}
          onClick={e=>{e.stopPropagation();if(!editingServ){setEditIdx(idx,"serv");setServVal(String(servings));}}}>
          <span style={{fontSize:10,fontWeight:300,color:C.dim,marginRight:2}}>SRV</span>
          {editingServ
            ?<input autoFocus type="number" inputMode="decimal"
                style={{width:60,background:"transparent",border:"none",borderBottom:`2px solid ${C.accent}`,color:C.accent,fontSize:22,fontWeight:200,textAlign:"left",outline:"none",fontFamily:"'Inter',sans-serif",letterSpacing:"-0.5px",padding:0}}
                value={servVal} onChange={e=>setServVal(e.target.value)}
                onBlur={()=>commitServ(idx)} onKeyDown={e=>e.key==="Enter"&&commitServ(idx)}/>
            :<span style={{fontSize:22,fontWeight:200,color:C.text,letterSpacing:"-0.5px"}}>{servings}</span>
          }
          {!editingServ&&<span style={{color:C.dim,display:"inline-flex",alignItems:"center",marginLeft:2}}><IcEdit size={11}/></span>}
        </div>
        <div style={{display:"flex",alignItems:"baseline",gap:4,cursor:"pointer"}}
          onClick={e=>{e.stopPropagation();if(!editingCal){setEditIdx(idx,"cal");setCalVal(String(ing.calories));}}}>
          <span style={{fontSize:10,fontWeight:300,color:C.dim,marginRight:2}}>CAL</span>
          {editingCal
            ?<input autoFocus type="number" inputMode="numeric"
                style={{width:70,background:"transparent",border:"none",borderBottom:`2px solid ${C.accent}`,color:C.accent,fontSize:22,fontWeight:200,textAlign:"right",outline:"none",fontFamily:"'Inter',sans-serif",letterSpacing:"-0.5px",padding:0}}
                value={calVal} onChange={e=>setCalVal(e.target.value)}
                onBlur={()=>commitCal(idx)} onKeyDown={e=>e.key==="Enter"&&commitCal(idx)}/>
            :<span style={{fontSize:22,fontWeight:200,color:C.accent,letterSpacing:"-0.5px"}}>{ing.calories}</span>
          }
          {!editingCal&&<span style={{color:C.dim,display:"inline-flex",alignItems:"center",marginLeft:2}}><IcEdit size={11}/></span>}
        </div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:4}}>
        {(ing.proteinG||0)>0&&<span style={{fontSize:10,fontWeight:300,color:C.protein}}>{Math.round(ing.proteinG)}g protein</span>}
        {(ing.carbsG||0)>0&&<span style={{fontSize:10,fontWeight:300,color:C.carbs}}>{Math.round(ing.carbsG)}g carbs</span>}
        {(ing.fatG||0)>0&&<span style={{fontSize:10,fontWeight:300,color:C.fat}}>{Math.round(ing.fatG)}g fat</span>}
      </div>
    </div>
  </div>;
}

const r1 = n => Math.round(n*10)/10;

/* Pull a count out of a name like "Crunchy Taco x2" or "2 servings of rice".
   Returns the count and the name with the quantity stripped off. */
function inferServings(name) {
  const n = name || "";
  let m = n.match(/^([\d.]+)\s*(?:servings?|srv)\s+(?:of\s+)?/i);
  if (m) return { n: parseFloat(m[1]), name: n.slice(m[0].length).trim() };
  m = n.match(/^(\d+(?:\.\d+)?)\s*[x×]\s+/i);
  if (m) return { n: parseFloat(m[1]), name: n.slice(m[0].length).trim() };
  m = n.match(/\s*[x×]\s*(\d+(?:\.\d+)?)\s*$/i);
  if (m) return { n: parseFloat(m[1]), name: n.slice(0, m.index).trim() };
  return { n: 1, name: n };
}

/* Two different inputs arrive here and they mean opposite things:
   - servings supplied by the API: per-unit values, so multiply up to get totals.
   - a count found only in the name (older meals): the numbers are ALREADY the
     combined total, so divide down to get the per-unit base.
   Getting these backwards is what silently doubles or halves a meal. */
const normalise = ings => (ings||[]).map(raw => {
  const ing = {...raw, proteinG: raw.proteinG||0, carbsG: raw.carbsG||0, fatG: raw.fatG||0};
  const given = Number(ing.servings);
  const info = inferServings(ing.name || "");
  ing.name = info.name || ing.name;

  if (ing.baseCalories != null) {           // already normalised previously
    ing.servings = given > 0 ? given : 1;
    ing.baseProteinG = ing.baseProteinG ?? 0;
    ing.baseCarbsG   = ing.baseCarbsG   ?? 0;
    ing.baseFatG     = ing.baseFatG     ?? 0;
    return ing;
  }

  if (given > 1) {                          // per-unit values + explicit count
    ing.servings = given;
    ing.baseCalories = ing.calories || 0;
    ing.baseProteinG = ing.proteinG;
    ing.baseCarbsG   = ing.carbsG;
    ing.baseFatG     = ing.fatG;
    ing.calories = Math.round(ing.baseCalories * given);
    ing.proteinG = r1(ing.baseProteinG * given);
    ing.carbsG   = r1(ing.baseCarbsG   * given);
    ing.fatG     = r1(ing.baseFatG     * given);
    return ing;
  }

  if (info.n > 1) {                         // count only in the name — totals already combined
    ing.servings = info.n;
    ing.baseCalories = Math.round((ing.calories||0) / info.n);
    ing.baseProteinG = r1(ing.proteinG / info.n);
    ing.baseCarbsG   = r1(ing.carbsG   / info.n);
    ing.baseFatG     = r1(ing.fatG     / info.n);
    return ing;
  }

  ing.servings = 1;
  ing.baseCalories = ing.calories || 0;
  ing.baseProteinG = ing.proteinG;
  ing.baseCarbsG   = ing.carbsG;
  ing.baseFatG     = ing.fatG;
  return ing;
});

function DetailScreen({meal,onBack,onUpdate,onDelete,apiKey}) {
  const [ings,setIngs]=useState(()=>normalise(meal.ingredients));
  const [editTotal,setEditTotal]=useState(false);
  const [totalVal,setTotalVal]=useState(String(meal.totalCalories));
  const [editTitle,setEditTitle]=useState(false);
  const [titleVal,setTitleVal]=useState(meal.mealTitle);
  const [editIdx,setEditIdx]=useState(null);
  const [editField,setEditField]=useState(null);
  const [servVal,setServVal]=useState("");
  const [calVal,setCalVal]=useState("");
  const [adding,setAdding]=useState(false);
  const [addText,setAddText]=useState("");
  const [addError,setAddError]=useState("");
  const [addLoading,setAddLoading]=useState(false);
  const [busyMsg,setBusyMsg]=useState("");
  const [lightbox,setLightbox]=useState(false);
  const [recent,setRecent]=useState(()=>loadItems().sort(itemSort).slice(0,8));
  const isWorkout=meal.type==="workout";
  const photoRef=useRef();
  const baseRef=useRef("");

  const onSpeechUpdate=useCallback(t=>setAddText(baseRef.current+t),[]);
  const speech=useWebSpeech(onSpeechUpdate);
  const startMic=()=>{ baseRef.current = addText ? addText.replace(/\s+$/,"")+" " : ""; speech.start(); };
  useEffect(()=>()=>speech.stop(),[]);

  const setEditIdx2 = (idx, field) => { setEditIdx(idx); setEditField(field); };
  const sumCal = ings.reduce((s,x)=>s+(x.calories||0),0);
  const inSync = ings.length>0 && Math.round(sumCal)===meal.totalCalories;

  const save = (newIngs, extra={}) => {
    const tot = Math.round(newIngs.reduce((s,x)=>s+(x.calories||0),0));
    setTotalVal(String(tot));
    onUpdate({...meal, ...extra,
      totalCalories: tot,
      totalProteinG: newIngs.reduce((s,x)=>s+(x.proteinG||0),0),
      totalCarbsG:   newIngs.reduce((s,x)=>s+(x.carbsG||0),0),
      totalFatG:     newIngs.reduce((s,x)=>s+(x.fatG||0),0),
      ingredients: newIngs});
  };

  const commitTitle = () => {
    const t = titleVal.trim();
    if (t) onUpdate({...meal, mealTitle:t, ingredients:ings});
    else setTitleVal(meal.mealTitle);
    setEditTitle(false);
  };
  const commitTotal=()=>{const n=parseInt(totalVal);if(!isNaN(n)&&n>=0)onUpdate({...meal,totalCalories:n,ingredients:ings});else setTotalVal(String(meal.totalCalories));setEditTotal(false);};

  const commitServ = idx => {
    const n = parseFloat(servVal);
    if (!isNaN(n) && n > 0) {
      const next = ings.map((x,i) => i!==idx ? x : ({...x, servings:n,
        calories: Math.round(x.baseCalories*n),
        proteinG: Math.round((x.baseProteinG||0)*n*10)/10,
        carbsG:   Math.round((x.baseCarbsG||0)*n*10)/10,
        fatG:     Math.round((x.baseFatG||0)*n*10)/10}));
      setIngs(next); save(next);
    }
    setEditIdx(null); setEditField(null);
  };

  const commitCal = idx => {
    const n = parseInt(calVal);
    if (!isNaN(n) && n >= 0) {
      const next = ings.map((x,i) => i!==idx ? x : ({...x, calories:n, baseCalories: x.servings>0 ? Math.round(n/x.servings) : n}));
      setIngs(next); save(next);
    }
    setEditIdx(null); setEditField(null);
  };

  const appendIngredients = (raw, extra={}) => {
    const added = normalise(raw);
    const next = [...ings, ...added];
    recordItems(added);
    setRecent(loadItems().sort(itemSort).slice(0,8));
    setIngs(next);
    save(next, extra);
  };

  // Reuse a past item — no API call, instant.
  const addRecent = it => {
    appendIngredients([{name:it.name,calories:it.calories,proteinG:it.proteinG,carbsG:it.carbsG,fatG:it.fatG}]);
  };

  const addByText = async () => {
    if (!addText.trim()) return;
    speech.stop();
    setAddLoading(true); setAddError("");
    try {
      const r = await analyze(apiKey, null, addText);
      const raw = r.ingredients?.length ? r.ingredients : [{name:r.mealTitle,calories:r.totalCalories,proteinG:r.totalProteinG||0,carbsG:r.totalCarbsG||0,fatG:r.totalFatG||0}];
      const extra = {};
      if (!meal.emoji || meal.mealTitle === "New meal") extra.emoji = r.emoji || meal.emoji;
      appendIngredients(raw, extra);
      setAddText(""); setAdding(false);
    } catch(e) { setAddError(e.message||"Couldn't add that — try again"); }
    setAddLoading(false);
  };

  const addByPhoto = async file => {
    setBusyMsg("Analyzing item…");
    try {
      const shot = await fileToImageData(file);
      if (!shot) { setBusyMsg(""); setAddError("Couldn't read that photo"); return; }
      const r = await analyze(apiKey, shot.imageData, null);
      const raw = r.ingredients?.length ? r.ingredients : [{name:r.mealTitle,calories:r.totalCalories,proteinG:r.totalProteinG||0,carbsG:r.totalCarbsG||0,fatG:r.totalFatG||0}];
      const extra = {};
      if (!meal.imageBase64) {
        const thumb = await makeThumbnail(shot.imageData.base64, "image/jpeg");
        if (thumb) { extra.imageBase64 = thumb; extra.imageMime = "image/jpeg"; }
      }
      if (!meal.emoji || meal.mealTitle === "New meal") extra.emoji = r.emoji || meal.emoji;
      appendIngredients(raw, extra);
    } catch(e) { setAddError(e.message||"Couldn't analyze that photo"); }
    setBusyMsg("");
  };

  if (busyMsg) return <Spinner text={busyMsg}/>;

  if (lightbox && meal.imageBase64) return <div
    style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.94)",zIndex:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"20px"}}
    onClick={()=>setLightbox(false)}>
    <img src={`data:${meal.imageMime||"image/jpeg"};base64,${meal.imageBase64}`}
      style={{maxWidth:"100%",maxHeight:"82%",objectFit:"contain",borderRadius:12,display:"block"}} alt=""/>
    <button style={{marginTop:22,background:C.hover,border:`1px solid ${C.border}`,borderRadius:12,color:C.text,fontSize:14,fontWeight:400,padding:"12px 28px"}}
      onClick={()=>setLightbox(false)}>Close</button>
  </div>;

  return <div style={{height:"100%",background:C.bg,overflowY:"auto",paddingBottom:48}}>
    <StickyHeader
      left={<HeaderBtn onClick={onBack}><IcBack/></HeaderBtn>}
      title={isWorkout?"Workout":"Meal details"}
      right={<HeaderBtn tone="danger" onClick={()=>onDelete(meal.id)}><IcTrash/></HeaderBtn>}
    />
    {isWorkout&&<div style={{width:"100%",height:110,background:C.oDim,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:52}}>🔥</span></div>}

    <div style={{padding:"18px 20px 40px"}}>
      {/* Thumbnail sits beside the title instead of eating a third of the screen.
          Tap it for the full-size view. */}
      <div style={{display:"flex",gap:14,alignItems:"flex-start",marginBottom:14}}>
        {!isWorkout&&<div style={{flexShrink:0,position:"relative",cursor:meal.imageBase64?"pointer":"default"}}
          onClick={()=>{ if(meal.imageBase64) setLightbox(true); }}>
          {meal.imageBase64
            ?<>
              <img src={`data:${meal.imageMime||"image/jpeg"};base64,${meal.imageBase64}`}
                style={{width:84,height:84,borderRadius:14,objectFit:"cover",display:"block",border:`1px solid ${C.border}`}} alt=""/>
              <div style={{position:"absolute",bottom:4,right:4,background:"rgba(10,10,15,0.8)",borderRadius:6,padding:"2px 5px"}}>
                <span style={{fontSize:8,fontWeight:400,color:C.text}}>TAP</span>
              </div>
            </>
            :<div style={{width:84,height:84,borderRadius:14,background:C.surface,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:34}}>{meal.emoji||"🍽️"}</span>
            </div>}
        </div>}
        <div style={{flex:1,minWidth:0}}>
          {editTitle
            ?<input autoFocus value={titleVal} onChange={e=>setTitleVal(e.target.value)} onBlur={commitTitle} onKeyDown={e=>e.key==="Enter"&&commitTitle()}
               style={{width:"100%",background:"transparent",border:"none",borderBottom:`2px solid ${C.accent}`,color:C.text,fontSize:19,fontWeight:400,fontFamily:"'Inter',sans-serif",letterSpacing:"-0.3px",outline:"none",padding:"0 0 4px",marginBottom:6}}/>
            :<h2 style={{fontSize:19,fontWeight:400,color:isWorkout?C.orange:C.text,marginBottom:5,letterSpacing:"-0.3px",lineHeight:1.3,cursor:"pointer"}}
               onClick={()=>{setTitleVal(meal.mealTitle);setEditTitle(true);}}>
               {meal.mealTitle}<span style={{color:C.dim,display:"inline-flex",marginLeft:7,verticalAlign:"middle"}}><IcEdit size={13}/></span>
             </h2>
          }
          <p style={{fontSize:11,color:C.dim}}>{meal.time}</p>
        </div>
      </div>
      {meal.summary&&<p style={{fontSize:12,fontWeight:300,color:C.sub,lineHeight:1.6,marginBottom:16}}>{meal.summary}</p>}

      <div style={{display:"flex",flexDirection:"column",gap:4,padding:"14px 18px",background:isWorkout?C.oDim:C.aDim,border:`1px solid ${isWorkout?C.oMid:C.aMid}`,borderRadius:16,cursor:"pointer",marginBottom:10}} onClick={()=>{setTotalVal(String(meal.totalCalories));setEditTotal(true);}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:13,fontWeight:400,color:C.text}}>{isWorkout?"Calories burned":"Calories"}</span>
          {editTotal
            ?<input autoFocus type="number" inputMode="numeric" style={{width:80,background:"transparent",border:"none",borderBottom:`2px solid ${isWorkout?C.orange:C.accent}`,color:isWorkout?C.orange:C.accent,fontSize:26,fontWeight:200,fontFamily:"'Inter',sans-serif",outline:"none",textAlign:"right"}} value={totalVal} onChange={e=>setTotalVal(e.target.value)} onBlur={commitTotal} onKeyDown={e=>e.key==="Enter"&&commitTotal()} onClick={e=>e.stopPropagation()}/>
            :<div style={{display:"flex",alignItems:"center",gap:5,color:isWorkout?C.orange:C.accent}}><span style={{fontSize:26,fontWeight:200,letterSpacing:"-1.5px"}}>{meal.totalCalories}</span><span style={{fontSize:11,opacity:0.7}}>kcal</span><IcEdit size={13}/></div>
          }
        </div>
        {!isWorkout&&ings.length>0&&<span style={{fontSize:10,fontWeight:300,color:inSync?C.dim:C.orange}}>
          {inSync ? `total of ${ings.length} ${ings.length===1?"item":"items"}` : `manual override · items total ${Math.round(sumCal)}`}
        </span>}
      </div>

      {!isWorkout&&<div style={{display:"flex",gap:8,marginBottom:18}}>
        {[["Protein",meal.totalProteinG,C.protein],["Carbs",meal.totalCarbsG,C.carbs],["Fat",meal.totalFatG,C.fat]].map(([lbl,v,col])=>
          <div key={lbl} style={{flex:1,padding:"12px 10px",background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,display:"flex",flexDirection:"column",alignItems:"center"}}>
            <span style={{fontSize:18,fontWeight:200,color:col,letterSpacing:"-0.5px"}}>{Math.round(v||0)}g</span>
            <span style={{fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.5px",marginTop:2}}>{lbl}</span>
          </div>
        )}
      </div>}

      {!isWorkout&&<div style={{background:C.surface,borderRadius:16,border:`1px solid ${C.border}`,overflow:"hidden",marginBottom:12}}>
        <div style={{padding:"12px 16px 10px"}}>
          <p style={{fontSize:11,fontWeight:400,color:C.sub,textTransform:"uppercase",letterSpacing:"1.2px"}}>Items</p>
        </div>

        {ings.length===0&&!adding&&<div style={{padding:"4px 16px 14px"}}>
          <p style={{fontSize:12,fontWeight:300,color:C.dim,lineHeight:1.6}}>No items yet. Photograph or say them one at a time — the total adds itself up.</p>

        {ings.map((ing,idx)=><SwipeIngRow key={idx} ing={ing} idx={idx} editIdx={editIdx} editField={editField} servVal={servVal} calVal={calVal} setServVal={setServVal} setCalVal={setCalVal} setEditIdx={setEditIdx2} commitServ={commitServ} commitCal={commitCal} onDelete={i=>{const next=ings.filter((_,j)=>j!==i);setIngs(next);save(next);}}/>)}

        {!adding&&<div style={{display:"flex",gap:8,padding:"12px 14px",borderTop:`1px solid ${C.border}`}}>
          <button style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:C.hover,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,fontSize:12,fontWeight:400,padding:"11px"}} onClick={()=>photoRef.current.click()}>

            <div onClick={speech.listening?speech.stop:startMic}
              style={{width:36,height:36,borderRadius:"50%",flexShrink:0,background:speech.listening?"rgba(255,68,68,0.12)":C.aDim,border:`2px solid ${speech.listening?C.red:C.accent}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
              <div style={{color:speech.listening?C.red:C.accent}}>{speech.listening?<IcStop size={12}/>:<IcMic size={14}/>}</div>

function useSwipeDelete(onDelete, threshold=75) {
  const [swipeX,setSwipeX]=useState(0);
  const [swiping,setSwiping]=useState(false);
  const tx=useRef(0),ty=useRef(0);
  return {
    swipeX, swiping,
    handlers: {
      onTouchStart: e=>{tx.current=e.touches[0].clientX;ty.current=e.touches[0].clientY;setSwiping(false);},
      onTouchMove: e=>{const dx=e.touches[0].clientX-tx.current;const dy=Math.abs(e.touches[0].clientY-ty.current);if(dy>20&&Math.abs(dx)<20)return;if(dx<0){setSwiping(true);setSwipeX(Math.max(dx,-(threshold+25)));}},
      onTouchEnd: ()=>{if(swipeX<=-threshold)onDelete();else{setSwipeX(0);setSwiping(false);}}
    }
  };
}

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useCallback } = React;
// Bumped on every delivered build so a stale cached copy (very common with
// "Add to Home Screen" / re-opened local files) is instantly identifiable —
// visible in Settings and as a small footer on the home screen.
const APP_BUILD = "2026.10.09-no-meal-photo-storage-2";
/* ─── Storage tuning ────────────────────────────────────────────────────────
   Meal photos live in localStorage (~5MB cap) and age out. Progress photos
   live in IndexedDB, which has far more room and no retention limit — body
   photos are the whole point of keeping them for months.
   ───────────────────────────────────────────────────────────────────────────*/
const PHOTO_MAX_PX = 480;
const PHOTO_QUALITY = 0.72;
const PHOTO_RETENTION_DAYS = 30;
const MEAL_RETENTION_DAYS = 180;
const ANALYSIS_MAX_PX = 1600;
const PROGRESS_MAX_PX = 900;
const PROGRESS_QUALITY = 0.82;
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k,v) => { try { localStorage.setItem(k,v); return true; } catch(e) { console.warn("localStorage write failed:",e); return false; } }
};
function makeThumbnail(base64, mimeType, size=PHOTO_MAX_PX, quality=PHOTO_QUALITY) {
  return new Promise(resolve => {
    try {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(size/img.width, size/img.height, 1);
        const w = Math.round(img.width*s), h = Math.round(img.height*s);
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.onerror = () => resolve(null);
      img.src = `data:${mimeType};base64,${base64}`;
    } catch { resolve(null); }
  });
}
function fileToImageData(file, maxPx=ANALYSIS_MAX_PX) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if (w>maxPx || h>maxPx) { const s=Math.min(maxPx/w, maxPx/h); w=Math.round(w*s); h=Math.round(h*s); }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL("image/jpeg",0.88);
        resolve({ imageData:{base64:dataUrl.split(",")[1], mimeType:"image/jpeg"}, preview:dataUrl });
      };
      img.onerror = () => resolve(null);
      img.src = ev.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}
/* ─── IndexedDB: progress photos ────────────────────────────────────────────*/
const IDB_NAME="jct-progress", IDB_STORE="photos";
function idb() {
  return new Promise((res,rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:"id"});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function progressAll() {
  try {
    const db = await idb();
    return await new Promise((res,rej) => {
      const tx = db.transaction(IDB_STORE,"readonly");
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = () => res((req.result||[]).sort((a,b)=>a.takenAt-b.takenAt));
      req.onerror = () => rej(req.error);
    });
  } catch(e) { console.warn("progress read failed:",e); return []; }
}
async function progressPut(rec) {
  const db = await idb();
  return new Promise((res,rej) => {
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(rec);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function progressDelete(id) {
  const db = await idb();
  return new Promise((res,rej) => {
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
/* Progress photos come in two categories — Front and Side — each with its
   own Before/After pair. PROGRESS_CATEGORIES drives the Progress screen's
   tabs; any photo missing a category (saved before categories existed)
   is treated as "front" everywhere, so nothing from before this update
   disappears. */
const PROGRESS_CATEGORIES = [{key:"front",label:"Front"},{key:"side",label:"Side"}];
const photoCategory = p => p?.category || "front";
/* Which photo counts as "the before picture" for a given category — whatever
   is currently pinned in that category's Before pane on the Progress screen,
   persisted so Home can read it without that screen being open. Front falls
   back to the pre-category single pin key so photos pinned before this
   update keep pointing at the same photo. */
const loadBeforePhotoId = cat => ls.get(`jct:beforeid:${cat}`) || (cat==="front" ? ls.get("jct:beforeid") : null) || null;
const saveBeforePhotoId = (cat,id) => ls.set(`jct:beforeid:${cat}`, id);
const hasSeenPhotoPrompt = () => ls.get("jct:seenphotoprompt") === "1";
const markSeenPhotoPrompt = () => ls.set("jct:seenphotoprompt", "1");
/* Falls back to the earliest saved photo in each category if nothing's been
   explicitly pinned yet — matches the default the Progress screen itself
   picks on first load, so the two stay in sync before the user ever repins
   one. Returns one entry per category, either a photo record or null. */
async function getPinnedBeforePhotos() {
  const empty = {front:null, side:null};
  try {
    const all = await progressAll();
    if (!all.length) return empty;
    const out = {};
    PROGRESS_CATEGORIES.forEach(({key}) => {
      const list = all.filter(p => photoCategory(p) === key);
      if (!list.length) { out[key] = null; return; }
      const pinnedId = loadBeforePhotoId(key);
      out[key] = (pinnedId && list.find(p=>p.id===pinnedId)) || list[0];
    });
    return out;
  } catch(e) { console.warn("before-photos read failed:",e); return empty; }

/* ─── Speech ────────────────────────────────────────────────────────────────
   ONE SpeechRecognition instance for the whole app. Building a new one on every
   start() causes repeat permission prompts within a session — reusing this keeps
   the first grant alive until the app is fully closed. iOS still asks once per
   app launch; that's an OS rule with no workaround.

let _rec = null;

    _rec.interimResults = true;
    _rec.lang = "en-US";
  }

}
/* Starts the mic the instant a gesture happens (e.g. a button tap), before
   the screen that actually wants the transcript has even mounted. Browsers
   only grant mic permission within a fresh user gesture — waiting until
   after an on-screen delay (like the before-photo flash) risks the prompt
   being silently blocked. The screen that mounts afterward "adopts" this
   already-running session via useWebSpeech's start(), see below. */
function prewarmSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || _recRunning) return;
  const rec = getRecognizer();
  if (!rec) return;
  rec.onstart = () => { _recRunning = true; };
  rec.onerror = () => { _recRunning = false; };
  rec.onend   = () => { _recRunning = false; };

function useWebSpeech(onUpdate) {

    // shows "listening" while the permission dialog is still up.
    rec.onstart = () => { _recRunning = true; activeRef.current = true; setListening(true); };
    rec.onerror = () => { _recRunning = false; activeRef.current = false; setListening(false); };
    rec.onend   = () => { _recRunning = false; activeRef.current = false; setListening(false); };

/* Listening indicator. Deliberately not a waveform — reading real levels needs
   getUserMedia, a second permission prompt. This shows recording state only;
   the live transcript is the real feedback. */
function ListeningBars({active}) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const BARS = 24;
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const flat = () => {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const bw = canvas.width/BARS;
      ctx.fillStyle = "rgba(74,230,138,0.18)";
      for (let i=0;i<BARS;i++){ ctx.beginPath(); ctx.roundRect(i*bw+1,(canvas.height-4)/2,bw-2,4,2); ctx.fill(); }
    };
    if (!active) { cancelAnimationFrame(rafRef.current); flat(); return; }
    let t = 0;
    const animate = () => {
      rafRef.current = requestAnimationFrame(animate);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const bw=canvas.width/BARS, maxH=canvas.height*0.88;
      for (let i=0;i<BARS;i++){
        const v=Math.abs(Math.sin(t*2.1+i*0.4))*0.55+0.12;
        const h=Math.max(4,v*maxH);
        ctx.fillStyle=`rgba(74,230,138,${0.22+v*0.55})`;
        ctx.beginPath(); ctx.roundRect(i*bw+1,(canvas.height-h)/2,bw-2,h,3); ctx.fill();
      }
      t+=0.05;
    };
    animate();
    return () => cancelAnimationFrame(rafRef.current);
  }, [active]);

    <canvas ref={canvasRef} width={340} height={52} style={{width:"100%",height:"100%",opacity:active?1:0.3,transition:"opacity 0.3s"}}/>

}

  const color = trendDown ? C.accent : C.orange;

function DescribeScreen({apiKey,onBack,onAdd}) {
  const [text,setText]=useState("");

  const startMic=()=>{ baseRef.current = text ? text.replace(/\s+$/,"")+" " : ""; speech.start(); };
  // Mic no longer auto-starts on mount. It used to, which meant background
  // noise (a TV, a radio) could be picked up and transcribed over whatever
  // you were typing by hand the instant this screen opened — typing and
  // speaking are now both just explicit choices: tap the mic to dictate,
  // or ignore it and type straight into the box below.
  useEffect(()=>()=>speech.stop(),[]);
  const submit = async () => {
    if (!text.trim()) return;
    speech.stop();
    setSubmitting(true); setRetryNote("");
    try {
      const r = await analyze(apiKey, null, text, (n,max)=>setRetryNote(`Hit a snag — retrying (${n}/${max-1})...`));
      const now = new Date();
      onAdd({
        id:uid(), mealTitle:r.mealTitle, totalCalories:Math.round(r.totalCalories||0),
        totalProteinG:Math.round(r.totalProteinG||0), totalCarbsG:Math.round(r.totalCarbsG||0), totalFatG:Math.round(r.totalFatG||0), totalSatFatG:Math.round(r.totalSatFatG||0),
        ingredients:r.ingredients||[], summary:r.summary, imageBase64:null,
        time:now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),
        addedAt:now.getTime(), emoji:r.emoji||"🍽️"
      });
    } catch(e) { setError(e.message||"Something went wrong — check Settings ⚙️"); setSubmitting(false); }
  };
  if (submitting) return <Spinner text={retryNote||"Building your meal..."}/>;
  return <div style={{height:"100%",background:C.bg,overflowY:"auto",paddingBottom:40}}>
    <StickyHeader left={<HeaderBtn onClick={()=>{speech.stop();onBack();}}><IcBack/></HeaderBtn>} title="Say what you ate"/>

          <div style={{color:speech.listening?C.red:C.accent}}>{speech.listening?<IcStop size={30}/>:<IcMic size={38}/>}</div>
        </div>
        <p style={{fontSize:14,fontWeight:300,color:speech.listening?C.red:C.sub,textAlign:"center"}}>
          {!speech.supported?"Type what you ate below":speech.listening?"Listening — tap to stop":"Tap to speak, or just type below"}
        </p>
      </div>
      <ListeningBars active={speech.listening}/>
      <textarea autoFocus style={{width:"100%",minHeight:100,background:C.surface,border:`1px solid ${text?C.aMid:C.border}`,borderRadius:14,color:text?C.text:C.sub,fontSize:15,padding:"14px 16px",resize:"none",outline:"none",fontFamily:"'Inter',sans-serif",lineHeight:1.65,transition:"border-color 0.2s"}}
        placeholder={speech.supported?"Type here, or tap the mic to speak — e.g. \"a salad with chicken\"":"e.g. a salad with chicken"}
        value={text} onChange={e=>setText(e.target.value)}/>
      <p style={{fontSize:11,fontWeight:300,color:C.dim,lineHeight:1.6,textAlign:"center"}}>You'll land on the meal page next, where you can photograph each item.</p>
      {error&&<div style={{background:C.rDim,border:`1px solid ${C.rMid}`,borderRadius:12,padding:"12px 14px"}}>
        <p style={{color:C.red,fontSize:13,fontWeight:500,lineHeight:1.5}}>⚠ {error}</p>

  </div>;
}

function useSwipeDelete(onDelete, threshold=75) {
  const [swipeX,setSwipeX]=useState(0);
  const [swiping,setSwiping]=useState(false);
  const tx=useRef(0),ty=useRef(0);
  return {
    swipeX, swiping,
    handlers: {
      onTouchStart: e=>{tx.current=e.touches[0].clientX;ty.current=e.touches[0].clientY;setSwiping(false);},
      onTouchMove: e=>{const dx=e.touches[0].clientX-tx.current;const dy=Math.abs(e.touches[0].clientY-ty.current);if(dy>20&&Math.abs(dx)<20)return;if(dx<0){setSwiping(true);setSwipeX(Math.max(dx,-(threshold+25)));}},
      onTouchEnd: ()=>{if(swipeX<=-threshold)onDelete();else{setSwipeX(0);setSwiping(false);}}
    }
  };
}

function useLongPress(onLongPress, ms=550) {
  const timer = useRef(null);
  const fired = useRef(false);
  const start = () => { fired.current=false; clearTimeout(timer.current); timer.current=setTimeout(()=>{ fired.current=true; onLongPress(); }, ms); };
  const clear = () => { clearTimeout(timer.current); timer.current=null; };
  return {
    onTouchStart:start, onTouchEnd:clear, onTouchMove:clear, onTouchCancel:clear,
    onMouseDown:start, onMouseUp:clear, onMouseLeave:clear,
    onContextMenu:e=>{ e.preventDefault(); clear(); onLongPress(); },
    consumeFired: () => { const f=fired.current; fired.current=false; return f; }
  };
}

  const deleteMealsBeforeDate = cutoffKey => { const n = deleteMealsBefore(cutoffKey); bump(); return n; };
  const selectMeal=m=>{
    if(m._delete){const k=dateKeyRef.current;saveMealsRobust(k,loadMeals(k).filter(x=>x.id!==m.id));bump();return;}
    setSelected(m);setScreen("detail");
  };
  if (!apiKey) return <ApiKeyScreen onSave={saveApiKey}/>;
  return <div style={{height:"100%"}}>
    {screen==="home"&&<HomeScreen
      onOpenCamera={(imageData,preview)=>{setCamImg({imageData,preview});setScreen("camera");}}
      onOpenDescribe={()=>setScreen("describe")}
      onOpenLibrary={()=>setScreen("library")}
      onAddWorkout={addWorkout} onSelectMeal={selectMeal}
      onOpenSettings={()=>setScreen("settings")}
      onOpenWeightHistory={()=>setScreen("weightHistory")}
      onOpenProgress={()=>setScreen("progress")}
      onOpenMacro={m=>{setMacroMetric(m);setScreen("macroHistory");}}
      meals={meals} goal={effectiveGoal} baseGoal={baseGoal}
      setBaseGoal={n=>{setBaseGoal(n);saveBaseGoal(n);}}
      date={new Date(dateKey+"T12:00:00")} setDate={changeDate}
      beforePhotos={beforePhotos} photoChecked={photoChecked}
    />}
    {screen==="camera"&&<PhotoScreen apiKey={apiKey} imageData={camImg.imageData} imagePreview={camImg.preview} onBack={()=>setScreen("home")} onAdd={addMeal}/>}
    {screen==="describe"&&<DescribeScreen apiKey={apiKey} onBack={()=>setScreen("home")} onAdd={addMeal}/>}
    {screen==="library"&&<LibraryScreen onBack={()=>setScreen("home")}
      onPreviewMeal={t=>{setPreview({kind:"meal",tpl:t});setScreen("libraryPreview");}}
      onPreviewItem={t=>{setPreview({kind:"item",tpl:t});setScreen("libraryPreview");}}/>}
    {screen==="libraryPreview"&&preview&&<LibraryPreviewScreen tpl={preview.tpl} kind={preview.kind}
      onBack={()=>setScreen("library")}
      onAddWhole={tpl=>addFromLibrary(tpl)}
      onAddSelected={(tpl,ings)=>addFromLibrary(tpl,ings)}
      onAddItem={addItemAsMeal}/>}
    {screen==="progress"&&<ProgressScreen onBack={()=>{setScreen("home");refreshBeforePhoto();}}/>}
    {screen==="detail"&&selected&&<DetailScreen meal={selected} onBack={leaveDetail} onUpdate={updateMeal} onDelete={deleteMeal} apiKey={apiKey}/>}
    {screen==="settings"&&<SettingsScreen apiKey={apiKey} onSave={saveApiKey} onClear={clearApiKey} onBack={()=>setScreen("home")} goal={effectiveGoal} onDeleteBefore={deleteMealsBeforeDate}/>}
    {screen==="weightHistory"&&<WeightHistoryScreen onBack={()=>setScreen("home")}/>}
    {screen==="macroHistory"&&<NutrientHistoryScreen metric={macroMetric} goal={effectiveGoal} onBack={()=>setScreen("home")}/>}
  </div>;
}
maybePruneOldData();
if (window.__bootTimeout) clearTimeout(window.__bootTimeout);
try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
} catch(e) {
  document.getElementById("root").innerHTML =
    '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A0A0F;color:#F0F0F8;font-family:sans-serif;padding:24px;text-align:center;gap:8px;">' +
    '<p style="font-size:32px;">⚠️</p>' +
    '<p style="font-size:15px;font-weight:600;">Something went wrong</p>' +
    '<p style="font-size:12px;opacity:0.6;max-width:280px;">' + (e.message||"Unknown error") + '</p>' +
    '<button onclick="location.reload()" style="margin-top:16px;background:#4AE68A;border:none;border-radius:10px;color:#0A0A0F;font-size:14px;font-weight:600;padding:12px 24px;">Reload</button>' +
    '</div>';
}
</script>
</body>
</html>
